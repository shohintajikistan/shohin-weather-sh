<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>SHOHIN Weather V5.5</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

*{
    box-sizing:border-box;
}

html,
body{

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:#07111f;

}

#app{

    width:100%;
    height:100%;

    position:relative;

}

#map{

    position:absolute;

    inset:0;

}


/* TOP */

#topbar{

    position:absolute;

    z-index:3000;

    top:12px;
    left:12px;
    right:12px;

    height:55px;

    padding:0 16px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    border-radius:17px;

    color:white;

    background:
        rgba(5,15,28,.90);

    border:
        1px solid
        rgba(255,255,255,.12);

    backdrop-filter:
        blur(15px);

}

.logo{

    font-size:20px;

    font-weight:800;

}

.logo span{

    color:#38bdf8;

}

#online{

    font-size:11px;

}


/* WEATHER */

#weatherPanel{

    position:absolute;

    z-index:3000;

    top:80px;
    left:12px;

    width:300px;

    padding:16px;

    border-radius:20px;

    color:white;

    background:
        rgba(5,15,28,.90);

    border:
        1px solid
        rgba(255,255,255,.12);

    backdrop-filter:
        blur(17px);

}

#location{

    font-size:19px;

    font-weight:bold;

}

#coordinates{

    margin-top:4px;

    font-size:11px;

    color:#8fa8bd;

}

#temperature{

    margin-top:13px;

    font-size:54px;

    font-weight:300;

}

#weatherStatus{

    color:#9eb3c6;

    font-size:12px;

}


/* METRICS */

#metrics{

    margin-top:15px;

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:7px;

}

.metric{

    padding:9px;

    border-radius:10px;

    background:
        rgba(255,255,255,.06);

}

.metric-title{

    font-size:10px;

    color:#8fa8bd;

}

.metric-value{

    margin-top:4px;

    font-size:13px;

    font-weight:bold;

}


/* LAYERS */

#layers{

    position:absolute;

    z-index:3000;

    top:80px;
    right:12px;

    width:170px;

    padding:9px;

    border-radius:16px;

    background:
        rgba(5,15,28,.91);

    border:
        1px solid
        rgba(255,255,255,.12);

    backdrop-filter:
        blur(16px);

}

.layerTitle{

    padding:
        5px 7px 7px;

    color:#8fa8bd;

    font-size:10px;

}

.layerButton{

    width:100%;

    margin:3px 0;

    padding:9px;

    border:0;

    border-radius:9px;

    color:white;

    background:
        rgba(255,255,255,.06);

    text-align:left;

    cursor:pointer;

    font-size:12px;

}

.layerButton:hover{

    background:
        rgba(56,189,248,.18);

}

.layerButton.active{

    background:
        rgba(56,189,248,.30);

}


/* STATUS */

#systemStatus{

    position:absolute;

    z-index:3000;

    left:12px;
    bottom:12px;

    padding:9px 12px;

    border-radius:11px;

    color:#a8bdcf;

    font-size:10px;

    background:
        rgba(5,15,28,.90);

    border:
        1px solid
        rgba(255,255,255,.10);

}

#gridInfo{

    position:absolute;

    z-index:3000;

    right:12px;
    bottom:12px;

    padding:9px 12px;

    border-radius:11px;

    color:#a8bdcf;

    font-size:10px;

    background:
        rgba(5,15,28,.90);

}


/* LOADING */

#loading{

    position:absolute;

    z-index:9000;

    inset:0;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    color:white;

    background:#07111f;

}

#loading.hidden{

    display:none;

}

.loader{

    width:42px;
    height:42px;

    margin-bottom:14px;

    border-radius:50%;

    border:
        4px solid
        rgba(255,255,255,.12);

    border-top-color:
        #38bdf8;

    animation:
        spin .8s linear infinite;

}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* ERROR */

#error{

    display:none;

    position:absolute;

    z-index:10000;

    left:12px;
    right:12px;
    bottom:12px;

    max-height:50%;

    overflow:auto;

    padding:14px;

    border-radius:12px;

    background:
        rgba(127,29,29,.97);

    color:white;

    white-space:pre-wrap;

    font-size:12px;

}

#error.show{

    display:block;

}


/* WIND ARROWS */

.shohin-wind-arrow{

    background:transparent !important;

    border:0 !important;

}


/* MOBILE */

@media(max-width:650px){

    #topbar{

        top:6px;
        left:6px;
        right:6px;

    }

    #weatherPanel{

        top:68px;
        left:6px;

        width:265px;

        padding:13px;

    }

    #layers{

        top:68px;
        right:6px;

        width:145px;

    }

    #temperature{

        font-size:46px;

    }

}

</style>

</head>


<body>

<div id="app">

<div id="map"></div>


<!-- TOP -->

<div id="topbar">

<div class="logo">

🌍 SHOHIN
<span>WEATHER</span>

</div>

<div id="online">

● STARTING

</div>

</div>


<!-- WEATHER -->

<div id="weatherPanel">

<div id="location">

Dushanbe

</div>

<div id="coordinates">

38.5598° N, 68.7870° E

</div>

<div id="temperature">

--°C

</div>

<div id="weatherStatus">

Подключение...

</div>


<div id="metrics">


<div class="metric">

<div class="metric-title">

💧 Влажность

</div>

<div
id="humidity"
class="metric-value"
>

--

</div>

</div>


<div class="metric">

<div class="metric-title">

🌧 Осадки

</div>

<div
id="rain"
class="metric-value"
>

--

</div>

</div>


<div class="metric">

<div class="metric-title">

💨 Ветер

</div>

<div
id="wind"
class="metric-value"
>

--

</div>

</div>


<div class="metric">

<div class="metric-title">

☁ Облака

</div>

<div
id="clouds"
class="metric-value"
>

--

</div>

</div>


<div class="metric">

<div class="metric-title">

🌀 Давление

</div>

<div
id="pressure"
class="metric-value"
>

--

</div>

</div>


</div>

</div>


<!-- LAYERS -->

<div id="layers">

<div class="layerTitle">

WEATHER LAYERS

</div>


<button
id="temperatureLayer"
class="layerButton active"
>

🌡 Temperature

</button>


<button
id="gridLayer"
class="layerButton active"
>

🔥 Temperature Grid

</button>


<button
id="rainLayer"
class="layerButton"
>

🌧 Rain

</button>


<button
id="windLayer"
class="layerButton"
>

💨 Wind

</button>


<button
id="cloudLayer"
class="layerButton"
>

☁ Clouds

</button>


<button
id="pressureLayer"
class="layerButton"
>

🌀 Pressure

</button>

</div>


<div id="systemStatus">

SHOHIN V5.5 • Starting...

</div>


<div id="gridInfo">

GRID: starting...

</div>


<div id="loading">

<div class="loader"></div>

<div>

🌍 SHOHIN Weather V5.5

</div>

<div
id="loadingText"
style="
margin-top:7px;
color:#8fa8bd;
font-size:12px;
"
>

Запуск...

</div>

</div>


<div id="error"></div>


</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script type="module">


/*
====================================================
 SHOHIN WEATHER V5.5
 MAIN CONTROLLER
====================================================
*/


const $ =
id =>
document.getElementById(id);


const loading =
$("loading");

const loadingText =
$("loadingText");

const errorBox =
$("error");

const online =
$("online");

const systemStatus =
$("systemStatus");

const gridInfo =
$("gridInfo");

const status =
$("weatherStatus");


let WeatherEngine;

let MapEngine;

let WeatherGrid;

let RainLayer;

let WindLayer;


let weatherEngine;

let mapEngine;

let weatherGrid;

let rainLayer;

let windLayer;

let weatherData;

let temperatureLayer;

let gridVisible =
true;


/* =================================================
 LOAD MODULES
================================================= */

async function loadModules(){

loadingText.textContent =
"Загрузка WeatherEngine...";


const weatherModule =
await import(
"./js/WeatherEngine.js"
);


WeatherEngine =
weatherModule.WeatherEngine;


loadingText.textContent =
"Загрузка MapEngine...";


const mapModule =
await import(
"./js/MapEngine.js"
);


MapEngine =
mapModule.MapEngine;


loadingText.textContent =
"Загрузка WeatherGrid...";


const gridModule =
await import(
"./js/WeatherGrid.js"
);


WeatherGrid =
gridModule.WeatherGrid;


loadingText.textContent =
"Загрузка RainLayer...";


const rainModule =
await import(
"./js/RainLayer.js"
);


RainLayer =
rainModule.RainLayer;


loadingText.textContent =
"Загрузка WindLayer...";


const windModule =
await import(
"./js/WindLayer.js"
);


WindLayer =
windModule.WindLayer;

}


/* =================================================
 WEATHER
================================================= */

async function startWeather(){

loadingText.textContent =
"Подключение к API...";


weatherEngine =
new WeatherEngine();


weatherData =
await weatherEngine.load();


if(!weatherData){

throw new Error(
"WeatherEngine вернул пустые данные"
);

}

}


/* =================================================
 MAP
================================================= */

async function startMap(){

loadingText.textContent =
"Создание карты...";


mapEngine =
new MapEngine({

container:
"map",

latitude:
38.5598,

longitude:
68.7870,

zoom:
7

});


await mapEngine.init();

}


/* =================================================
 GRID
================================================= */

function createGrid(){

weatherGrid =
new WeatherGrid({

latitude:
38.5598,

longitude:
68.7870,

size:
17,

step:
0.15

});


const grid =
weatherGrid.build();


const temperature =
Number(
weatherData
?.hourly
?.temperature_2m
?.[0]
);


const base =
Number.isFinite(
temperature
)
?
temperature
:
20;


weatherGrid.applyValues(

grid.map(
point => base
)

);


gridInfo.textContent =

"GRID " +
weatherGrid.getSize() +
" × " +
weatherGrid.getSize() +
" • " +
grid.length +
" points";

}


/* =================================================
 TEMPERATURE COLOR
================================================= */

function temperatureColor(value){

if(value <= -20)
return "#172554";

if(value <= -10)
return "#1d4ed8";

if(value <= 0)
return "#38bdf8";

if(value <= 10)
return "#22d3ee";

if(value <= 20)
return "#4ade80";

if(value <= 25)
return "#facc15";

if(value <= 30)
return "#fb923c";

if(value <= 35)
return "#f97316";

if(value <= 40)
return "#ef4444";

return "#b91c1c";

}


/* =================================================
 TEMPERATURE GRID
================================================= */

function renderTemperatureGrid(){

if(
!mapEngine?.map ||
!weatherGrid
)
return;


hideTemperatureGrid();


temperatureLayer =
L.layerGroup();


const grid =
weatherGrid.getGrid();


const step =
weatherGrid.getStep();


grid.forEach(
point => {


const value =
Number(
point.value
);


const bounds = [

[
point.latitude-step/2,
point.longitude-step/2
],

[
point.latitude+step/2,
point.longitude+step/2
]

];


L.rectangle(

bounds,

{

stroke:false,

fill:true,

fillColor:
temperatureColor(
value
),

fillOpacity:
0.38,

interactive:false

}

).addTo(
temperatureLayer
);

});


temperatureLayer.addTo(
mapEngine.map
);


gridVisible =
true;

}


/* =================================================
 HIDE GRID
================================================= */

function hideTemperatureGrid(){

if(
temperatureLayer &&
mapEngine?.map
){

mapEngine.map
.removeLayer(
temperatureLayer
);

}

temperatureLayer =
null;

gridVisible =
false;

}


/* =================================================
 WEATHER UI
================================================= */

function updateWeather(){

const hourly =
weatherData?.hourly;


if(!hourly)
return;


const temperature =
Number(
hourly.temperature_2m?.[0]
);

const humidity =
Number(
hourly.relative_humidity_2m?.[0]
);

const rain =
Number(
hourly.precipitation?.[0]
);

const wind =
Number(
hourly.wind_speed_10m?.[0]
);

const clouds =
Number(
hourly.cloud_cover?.[0]
);

const pressure =
Number(
hourly.pressure_msl?.[0]
);


if(Number.isFinite(temperature))
$("temperature")
.textContent =
Math.round(
temperature
)+"°C";


if(Number.isFinite(humidity))
$("humidity")
.textContent =
Math.round(
humidity
)+"%";


if(Number.isFinite(rain))
$("rain")
.textContent =
rain.toFixed(1)
+" mm";


if(Number.isFinite(wind))
$("wind")
.textContent =
wind.toFixed(1)
+" km/h";


if(Number.isFinite(clouds))
$("clouds")
.textContent =
Math.round(
clouds
)+"%";


if(Number.isFinite(pressure))
$("pressure")
.textContent =
Math.round(
pressure
)+" hPa";

}


/* =================================================
 ACTIVE BUTTON
================================================= */

function setActive(id){

document
.querySelectorAll(
".layerButton"
)
.forEach(
button =>
button.classList.remove(
"active"
)
);


$(id)
.classList.add(
"active"
);

}


/* =================================================
 TEMPERATURE
================================================= */

$("temperatureLayer")
.onclick =
()=>{

if(rainLayer)
rainLayer.hide();

if(windLayer)
windLayer.hide();

renderTemperatureGrid();

setActive(
"temperatureLayer"
);

status.textContent =
"🌡 Temperature";

};


/* =================================================
 GRID
================================================= */

$("gridLayer")
.onclick =
()=>{

if(gridVisible){

hideTemperatureGrid();

}
else{

renderTemperatureGrid();

}

setActive(
"gridLayer"
);

};


/* =================================================
 RAIN
================================================= */

$("rainLayer")
.onclick =
()=>{

try{

if(windLayer)
windLayer.hide();

hideTemperatureGrid();


if(!rainLayer){

rainLayer =
new RainLayer(

mapEngine,

weatherData

);

}


rainLayer.show();


setActive(
"rainLayer"
);


status.textContent =
"🌧 Rain Layer";


systemStatus.textContent =
"SHOHIN V5.5 • RAIN ✓";

}
catch(error){

showError(
error
);

}

};


/* =================================================
 WIND
================================================= */

$("windLayer")
.onclick =
()=>{

try{

if(rainLayer)
rainLayer.hide();

hideTemperatureGrid();


if(!windLayer){

windLayer =
new WindLayer(

mapEngine,

weatherData

);

}


windLayer.show();


setActive(
"windLayer"
);


status.textContent =
"💨 Wind Layer";


systemStatus.textContent =
"SHOHIN V5.5 • WIND ✓";

}
catch(error){

showError(
error
);

}

};


/* =================================================
 CLOUD
================================================= */

$("cloudLayer")
.onclick =
()=>{

if(rainLayer)
rainLayer.hide();

if(windLayer)
windLayer.hide();

setActive(
"cloudLayer"
);

status.textContent =
"☁ Clouds — V5.6";

};


/* =================================================
 PRESSURE
================================================= */

$("pressureLayer")
.onclick =
()=>{

if(rainLayer)
rainLayer.hide();

if(windLayer)
windLayer.hide();

setActive(
"pressureLayer"
);

status.textContent =
"🌀 Pressure — V5.7";

};


/* =================================================
 ERROR
================================================= */

function showError(error){

console.error(
error
);


errorBox.textContent =

"❌ SHOHIN WEATHER V5.5\n\n" +

(
error?.stack ||
error?.message ||
String(error)
);


errorBox.classList.add(
"show"
);

}


/* =================================================
 START
================================================= */

async function start(){

try{

await loadModules();

await startWeather();

await startMap();

createGrid();

updateWeather();

renderTemperatureGrid();


online.textContent =
"● ONLINE";

online.style.color =
"#4ade80";


systemStatus.textContent =
"SHOHIN V5.5 • API ✓ • MAP ✓ • GRID ✓";


loading.classList.add(
"hidden"
);


console.log(
"SHOHIN WEATHER V5.5 READY"
);

}
catch(error){

loading.classList.add(
"hidden"
);

online.textContent =
"● ERROR";

online.style.color =
"#fb7185";


systemStatus.textContent =
"SHOHIN V5.5 • ERROR";


showError(
error
);

}

}


start();

</script>

</body>

</html>
