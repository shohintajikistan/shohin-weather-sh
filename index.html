<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        SHOHIN Weather V5
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: #07111f;

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }


        body {

            overflow: hidden;

        }


        #app {

            width: 100%;
            height: 100%;

            display: flex;
            flex-direction: column;

        }


        /* =========================
           HEADER
        ========================= */

        header {

            height: 64px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding:
                0 20px;

            background:
                rgba(5, 15, 28, .94);

            border-bottom:
                1px solid
                rgba(255,255,255,.1);

            position: relative;

            z-index: 10;

        }


        .logo {

            font-size: 21px;

            font-weight: 800;

            letter-spacing: .5px;

        }


        .logo span {

            color: #4db8ff;

        }


        #status {

            font-size: 13px;

            color: #9db2c8;

        }


        /* =========================
           MAIN
        ========================= */

        main {

            flex: 1;

            position: relative;

            overflow: hidden;

        }


        #map {

            position: absolute;

            inset: 0;

            background:

                radial-gradient(
                    circle at 50% 40%,
                    #163b5d 0%,
                    #091b2c 45%,
                    #040b13 100%
                );

        }


        /* =========================
           WEATHER CARD
        ========================= */

        #weatherCard {

            position: absolute;

            top: 20px;

            left: 20px;

            width: 300px;

            padding: 20px;

            border-radius: 20px;

            background:
                rgba(8,20,35,.82);

            border:
                1px solid
                rgba(255,255,255,.12);

            backdrop-filter:
                blur(16px);

            box-shadow:
                0 15px 50px
                rgba(0,0,0,.35);

            z-index: 5;

        }


        #location {

            font-size: 18px;

            font-weight: 700;

            margin-bottom: 10px;

        }


        #temperature {

            font-size: 58px;

            font-weight: 300;

            line-height: 1;

        }


        #description {

            margin-top: 8px;

            color: #a9bfd4;

        }


        /* =========================
           METRICS
        ========================= */

        #metrics {

            margin-top: 20px;

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 10px;

        }


        .metric {

            padding: 12px;

            border-radius: 13px;

            background:
                rgba(255,255,255,.06);

        }


        .metric-title {

            font-size: 11px;

            color: #8fa6bb;

            margin-bottom: 5px;

        }


        .metric-value {

            font-size: 15px;

            font-weight: 600;

        }


        /* =========================
           CONTROLS
        ========================= */

        #controls {

            position: absolute;

            right: 20px;

            top: 20px;

            z-index: 5;

            display: flex;

            flex-direction: column;

            gap: 8px;

        }


        button {

            border: none;

            outline: none;

            cursor: pointer;

            color: white;

            background:
                rgba(8,20,35,.88);

            border:
                1px solid
                rgba(255,255,255,.1);

            padding:
                11px 15px;

            border-radius: 12px;

            backdrop-filter:
                blur(12px);

        }


        button:hover {

            background:
                rgba(35,90,130,.9);

        }


        /* =========================
           TIMELINE
        ========================= */

        #timeline {

            position: absolute;

            left: 20px;
            right: 20px;

            bottom: 20px;

            height: 80px;

            z-index: 5;

            border-radius: 18px;

            background:
                rgba(5,15,27,.9);

            border:
                1px solid
                rgba(255,255,255,.1);

            backdrop-filter:
                blur(15px);

            display: flex;

            align-items: center;

            gap: 15px;

            padding:
                15px 20px;

        }


        #play {

            width: 45px;
            height: 45px;

            border-radius: 50%;

            font-size: 18px;

        }


        #timeSlider {

            flex: 1;

        }


        #timeLabel {

            width: 160px;

            font-size: 13px;

            color: #a8bed3;

            text-align: center;

        }


        input[type="range"] {

            width: 100%;

        }


        /* =========================
           LOADING
        ========================= */

        #loading {

            position: absolute;

            inset: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                rgba(2,8,15,.65);

            backdrop-filter:
                blur(5px);

            z-index: 20;

        }


        #loading.hidden {

            display: none;

        }


        .loader {

            width: 45px;
            height: 45px;

            border:
                4px solid
                rgba(255,255,255,.15);

            border-top-color:
                #4db8ff;

            border-radius: 50%;

            animation:
                spin .8s linear infinite;

        }


        @keyframes spin {

            to {

                transform:
                    rotate(360deg);

            }

        }


        /* =========================
           MOBILE
        ========================= */

        @media (
            max-width: 700px
        ) {

            #weatherCard {

                left: 10px;
                right: 10px;

                width: auto;

                top: 10px;

            }


            #controls {

                right: 10px;

                top: auto;

                bottom: 115px;

            }


            #timeline {

                left: 10px;
                right: 10px;

                bottom: 10px;

            }


            #timeLabel {

                display: none;

            }

        }

    </style>

</head>


<body>


<div id="app">


    <header>

        <div class="logo">

            🌍 SHOHIN
            <span>WEATHER</span>

        </div>


        <div id="status">

            V5 Engine

        </div>

    </header>


    <main>


        <div id="map">

            <!--
                Следующий этап:
                здесь будет настоящий
                WebGL weather renderer
            -->

        </div>


        <!-- WEATHER CARD -->

        <div id="weatherCard">

            <div id="location">

                Dushanbe

            </div>


            <div id="temperature">

                --°

            </div>


            <div id="description">

                Загрузка ECMWF...

            </div>


            <div id="metrics">


                <div class="metric">

                    <div class="metric-title">

                        💧 Влажность

                    </div>

                    <div
                        id="humidity"
                        class="metric-value"
                    >

                        --

                    </div>

                </div>


                <div class="metric">

                    <div class="metric-title">

                        🌧 Осадки

                    </div>

                    <div
                        id="rain"
                        class="metric-value"
                    >

                        --

                    </div>

                </div>


                <div class="metric">

                    <div class="metric-title">

                        💨 Ветер

                    </div>

                    <div
                        id="wind"
                        class="metric-value"
                    >

                        --

                    </div>

                </div>


                <div class="metric">

                    <div class="metric-title">

                        🌀 Давление

                    </div>

                    <div
                        id="pressure"
                        class="metric-value"
                    >

                        --

                    </div>

                </div>


                <div class="metric">

                    <div class="metric-title">

                        ☁ Облака

                    </div>

                    <div
                        id="clouds"
                        class="metric-value"
                    >

                        --

                    </div>

                </div>


                <div class="metric">

                    <div class="metric-title">

                        ⚡ CAPE

                    </div>

                    <div
                        id="cape"
                        class="metric-value"
                    >

                        --

                    </div>

                </div>


            </div>

        </div>


        <!-- CONTROLS -->

        <div id="controls">

            <button
                id="temperatureButton"
            >

                🌡 Температура

            </button>


            <button
                id="windButton"
            >

                💨 Ветер

            </button>


            <button
                id="rainButton"
            >

                🌧 Дождь

            </button>


            <button
                id="cloudButton"
            >

                ☁ Облака

            </button>

        </div>


        <!-- TIMELINE -->

        <div id="timeline">


            <button
                id="play"
            >

                ▶

            </button>


            <input
                id="timeSlider"
                type="range"
                min="0"
                max="0"
                step="0.25"
                value="0"
            >


            <div id="timeLabel">

                Загрузка...

            </div>


        </div>


        <!-- LOADING -->

        <div
            id="loading"
        >

            <div class="loader"></div>

        </div>


    </main>


</div>


<script type="module">


import {
    WeatherEngine
}
from "./js/WeatherEngine.js";


/* ==================================
   SHOHIN WEATHER V5
================================== */


const weather =
    new WeatherEngine();


const $ =
    id =>
        document.getElementById(id);


/* ==================================
   UI
================================== */

const status =
    $("status");

const loading =
    $("loading");

const location =
    $("location");

const temperature =
    $("temperature");

const description =
    $("description");

const humidity =
    $("humidity");

const rain =
    $("rain");

const wind =
    $("wind");

const pressure =
    $("pressure");

const clouds =
    $("clouds");

const cape =
    $("cape");

const slider =
    $("timeSlider");

const timeLabel =
    $("timeLabel");

const play =
    $("play");


/* ==================================
   LOADING
================================== */

weather.on(
    "loading",
    value => {

        if (value) {

            loading.classList
                .remove("hidden");

            status.textContent =
                "Загрузка ECMWF...";

        }
        else {

            loading.classList
                .add("hidden");

            status.textContent =
                "V5 Engine • ONLINE";

        }

    }
);


/* ==================================
   READY
================================== */

weather.on(
    "ready",
    () => {

        status.textContent =
            "ECMWF • ONLINE";


        updateUI();


        slider.max =
            Math.max(
                0,
                weather.getTimelineLength()-1
            );

    }
);


/* ==================================
   TIME
================================== */

weather.on(
    "time",
    () => {

        updateUI();

    }
);


/* ==================================
   ERROR
================================== */

weather.on(
    "error",
    error => {

        loading.classList
            .add("hidden");


        status.textContent =
            "API ERROR";


        description.textContent =
            error.message;

        console.error(
            error
        );

    }
);


/* ==================================
   UPDATE UI
================================== */

function updateUI() {

    const frame =
        weather.getCurrentFrame();


    if (!frame)
        return;


    const values =
        frame.values;


    location.textContent =
        weather.location.name ||
        "Dushanbe";


    if (
        Number.isFinite(
            values.temperature_2m
        )
    ) {

        temperature.textContent =
            Math.round(
                values.temperature_2m
            ) +
            "°";

    }


    humidity.textContent =
        format(
            values.relative_humidity_2m,
            "%",
            0
        );


    rain.textContent =
        format(
            values.precipitation,
            " mm",
            1
        );


    wind.textContent =
        format(
            values.wind_speed_10m,
            " km/h",
            1
        );


    pressure.textContent =
        format(
            values.pressure_msl,
            " hPa",
            0
        );


    clouds.textContent =
        format(
            values.cloud_cover,
            "%",
            0
        );


    cape.textContent =
        format(
            values.cape,
            " J/kg",
            0
        );


    if (frame.time) {

        timeLabel.textContent =
            formatDate(
                frame.time
            );

    }


    slider.value =
        frame.position;

}


/* ==================================
   FORMAT NUMBER
================================== */

function format(
    value,
    unit = "",
    decimals = 0
) {

    if (
        value === undefined ||
        value === null ||
        Number.isNaN(
            Number(value)
        )
    ) {

        return "--";

    }


    return (
        Number(value)
            .toFixed(decimals)
        +
        unit
    );

}


/* ==================================
   DATE
================================== */

function formatDate(
    value
) {

    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return value;

    }


    return date.toLocaleString(
        "ru-RU",
        {

            day:"2-digit",

            month:"2-digit",

            hour:"2-digit",

            minute:"2-digit"

        }
    );

}


/* ==================================
   TIMELINE
================================== */

slider.addEventListener(
    "input",
    () => {

        weather.setTime(
            Number(
                slider.value
            )
        );

    }
);


/* ==================================
   PLAY
================================== */

play.addEventListener(
    "click",
    () => {

        const playing =
            weather.togglePlay();


        play.textContent =
            playing
                ? "⏸"
                : "▶";

    }
);


/* ==================================
   LAYERS
================================== */

$("temperatureButton")
    .onclick = () => {

        weather.setLayer(
            "temperature"
        );

        description.textContent =
            "🌡 Температурный слой";

    };


$("windButton")
    .onclick = () => {

        weather.setLayer(
            "wind"
        );

        description.textContent =
            "💨 Ветровой слой";

    };


$("rainButton")
    .onclick = () => {

        weather.setLayer(
            "rain"
        );

        description.textContent =
            "🌧 Осадки";

    };


$("cloudButton")
    .onclick = () => {

        weather.setLayer(
            "clouds"
        );

        description.textContent =
            "☁ Облачность";

    };


/* ==================================
   START
================================== */

try {

    await weather.load();

}
catch (error) {

    console.error(
        "SHOHIN V5 failed:",
        error
    );

}


</script>


</body>

</html>
