<script type="module">


/*
====================================================
 SHOHIN WEATHER V5.3
 LIGHTWEIGHT WEATHER RENDERER
====================================================
*/


const $ =
    id =>
        document.getElementById(id);


const loading =
    $("loading");


const loadingText =
    $("loadingText");


const errorBox =
    $("error");


const online =
    $("online");


const systemStatus =
    $("systemStatus");


const gridInfo =
    $("gridInfo");


const status =
    $("weatherStatus");


/*
====================================================
 MODULES
====================================================
*/


let WeatherEngine;

let MapEngine;

let WeatherGrid;


/*
====================================================
 STATE
====================================================
*/


let weatherEngine = null;

let mapEngine = null;

let weatherGrid = null;

let weatherData = null;

let temperatureLayer = null;

let gridVisible = true;


/*
====================================================
 TIMEOUT
====================================================
*/


function timeout(
    promise,
    ms,
    message
) {

    return Promise.race([

        promise,

        new Promise(
            (_, reject) => {

                setTimeout(
                    () => {

                        reject(
                            new Error(
                                message
                            )
                        );

                    },
                    ms
                );

            }
        )

    ]);

}


/*
====================================================
 LOAD MODULES
====================================================
*/


async function loadModules() {


    loadingText.textContent =
        "Загрузка WeatherEngine...";


    const weatherModule =
        await timeout(

            import(
                "./js/WeatherEngine.js"
            ),

            10000,

            "WeatherEngine.js не загрузился"

        );


    WeatherEngine =
        weatherModule.WeatherEngine;


    if (
        typeof WeatherEngine !==
        "function"
    ) {

        throw new Error(
            "WeatherEngine не найден"
        );

    }


    loadingText.textContent =
        "Загрузка MapEngine...";


    const mapModule =
        await timeout(

            import(
                "./js/MapEngine.js"
            ),

            10000,

            "MapEngine.js не загрузился"

        );


    MapEngine =
        mapModule.MapEngine;


    if (
        typeof MapEngine !==
        "function"
    ) {

        throw new Error(
            "MapEngine не найден"
        );

    }


    loadingText.textContent =
        "Загрузка WeatherGrid...";


    const gridModule =
        await timeout(

            import(
                "./js/WeatherGrid.js"
            ),

            10000,

            "WeatherGrid.js не загрузился"

        );


    WeatherGrid =
        gridModule.WeatherGrid;


    if (
        typeof WeatherGrid !==
        "function"
    ) {

        throw new Error(
            "WeatherGrid не найден"
        );

    }

}


/*
====================================================
 WEATHER ENGINE
====================================================
*/


async function startWeather() {


    loadingText.textContent =
        "Подключение к погодному API...";


    online.textContent =
        "● API";


    weatherEngine =
        new WeatherEngine();


    weatherData =
        await timeout(

            weatherEngine.load(),

            10000,

            "Weather API не ответил за 10 секунд"

        );


    if (
        !weatherData
    ) {

        throw new Error(
            "WeatherEngine вернул пустые данные"
        );

    }

}


/*
====================================================
 MAP
====================================================
*/


async function startMap() {


    loadingText.textContent =
        "Создание карты...";


    online.textContent =
        "● MAP";


    const latitude =
        Number(
            weatherEngine
                ?.location
                ?.latitude
        );


    const longitude =
        Number(
            weatherEngine
                ?.location
                ?.longitude
        );


    const safeLat =
        Number.isFinite(
            latitude
        )
        ? latitude
        : 38.5598;


    const safeLon =
        Number.isFinite(
            longitude
        )
        ? longitude
        : 68.7870;


    mapEngine =
        new MapEngine({

            container:
                "map",

            latitude:
                safeLat,

            longitude:
                safeLon,

            zoom:
                7

        });


    await timeout(

        mapEngine.init(),

        10000,

        "MapEngine не запустился"

    );

}


/*
====================================================
 CREATE WEATHER GRID
====================================================
*/


function createGrid() {


    loadingText.textContent =
        "Создание температурной сетки...";


    const latitude =
        Number(
            weatherEngine
                ?.location
                ?.latitude
        );


    const longitude =
        Number(
            weatherEngine
                ?.location
                ?.longitude
        );


    const safeLat =
        Number.isFinite(
            latitude
        )
        ? latitude
        : 38.5598;


    const safeLon =
        Number.isFinite(
            longitude
        )
        ? longitude
        : 68.7870;


    weatherGrid =
        new WeatherGrid({

            latitude:
                safeLat,

            longitude:
                safeLon,

            size:
                17,

            step:
                0.15

        });


    const grid =
        weatherGrid.build();


    if (
        !Array.isArray(
            grid
        )
    ) {

        throw new Error(
            "WeatherGrid.build() не вернул массив"
        );

    }


    const currentTemperature =
        Number(
            weatherData
                ?.hourly
                ?.temperature_2m
                ?.at(0)
        );


    const baseTemperature =
        Number.isFinite(
            currentTemperature
        )
        ? currentTemperature
        : 20;


    const values =
        grid.map(
            point => {


                const distance =
                    Math.sqrt(

                        Math.pow(
                            point.latitude -
                            safeLat,
                            2
                        )

                        +

                        Math.pow(
                            point.longitude -
                            safeLon,
                            2
                        )

                    );


                /*
                ==================================
                NATURAL TEMPERATURE GRADIENT
                ==================================
                */

                return (

                    baseTemperature -

                    distance * 2.5

                );

            }
        );


    weatherGrid.applyValues(
        values
    );


    gridInfo.textContent =

        "GRID " +

        weatherGrid.getSize() +

        " × " +

        weatherGrid.getSize() +

        " • " +

        grid.length +

        " points";


    return grid;

}


/*
====================================================
 COLOR
====================================================
*/


function temperatureColor(
    temperature
) {


    /*
    ================================================
    VERY COLD
    ================================================
    */

    if (
        temperature <= -20
    ) {

        return "#172554";

    }


    if (
        temperature <= -10
    ) {

        return "#1d4ed8";

    }


    if (
        temperature <= 0
    ) {

        return "#38bdf8";

    }


    if (
        temperature <= 10
    ) {

        return "#22d3ee";

    }


    if (
        temperature <= 20
    ) {

        return "#4ade80";

    }


    if (
        temperature <= 25
    ) {

        return "#facc15";

    }


    if (
        temperature <= 30
    ) {

        return "#fb923c";

    }


    if (
        temperature <= 35
    ) {

        return "#f97316";

    }


    if (
        temperature <= 40
    ) {

        return "#ef4444";

    }


    return "#b91c1c";

}


/*
====================================================
 RENDER TEMPERATURE GRID
====================================================
*/


function renderTemperatureGrid() {


    if (
        !mapEngine ||
        !weatherGrid
    ) {

        return;

    }


    /*
    ================================================
    REMOVE OLD LAYER
    ================================================
    */


    if (
        temperatureLayer
    ) {

        mapEngine
            .map
            ?.removeLayer(
                temperatureLayer
            );

        temperatureLayer = null;

    }


    /*
    ================================================
    CREATE LEAFLET LAYER
    ================================================
    */


    temperatureLayer =
        L.layerGroup();


    const grid =
        weatherGrid.getGrid();


    const size =
        weatherGrid.getSize();


    const step =
        weatherGrid.getStep();


    /*
    ================================================
    CELL RENDER
    ================================================
    */


    grid.forEach(
        point => {


            const value =
                Number(
                    point.value
                );


            if (
                !Number.isFinite(
                    value
                )
            ) {

                return;

            }


            /*
            ----------------------------------------
            CELL BOUNDS
            ----------------------------------------
            */


            const halfStep =
                step / 2;


            const bounds = [

                [

                    point.latitude -
                    halfStep,

                    point.longitude -
                    halfStep

                ],

                [

                    point.latitude +
                    halfStep,

                    point.longitude +
                    halfStep

                ]

            ];


            /*
            ----------------------------------------
            COLOR
            ----------------------------------------
            */


            const color =
                temperatureColor(
                    value
                );


            /*
            ----------------------------------------
            RECTANGLE
            ----------------------------------------
            */


            const rectangle =
                L.rectangle(

                    bounds,

                    {

                        stroke:
                            false,

                        fill:
                            true,

                        fillColor:
                            color,

                        fillOpacity:
                            0.38,

                        interactive:
                            false

                    }

                );


            rectangle.addTo(
                temperatureLayer
            );


        }
    );


    /*
    ================================================
    ADD TO MAP
    ================================================
    */


    temperatureLayer.addTo(
        mapEngine.map
    );


    gridVisible = true;


    $("gridLayer")
        .classList
        .add(
            "active"
        );


}


/*
====================================================
 HIDE GRID
====================================================
*/


function hideGrid() {


    if (
        temperatureLayer
    ) {

        mapEngine
            .map
            ?.removeLayer(
                temperatureLayer
            );

    }


    gridVisible = false;


}


/*
====================================================
 WEATHER UI
====================================================
*/


function updateWeather() {


    const hourly =
        weatherData?.hourly;


    if (
        !hourly
    ) {

        throw new Error(
            "В API отсутствует hourly"
        );

    }


    const i = 0;


    /*
    ================================================
    TEMPERATURE
    ================================================
    */


    const temperature =
        Number(
            hourly
                ?.temperature_2m
                ?.at(i)
        );


    if (
        Number.isFinite(
            temperature
        )
    ) {

        $("temperature")
            .textContent =

            Math.round(
                temperature
            ) +

            "°C";

    }


    /*
    ================================================
    HUMIDITY
    ================================================
    */


    const humidity =
        Number(
            hourly
                ?.relative_humidity_2m
                ?.at(i)
        );


    if (
        Number.isFinite(
            humidity
        )
    ) {

        $("humidity")
            .textContent =

            Math.round(
                humidity
            ) +

            "%";

    }


    /*
    ================================================
    RAIN
    ================================================
    */


    const rain =
        Number(
            hourly
                ?.precipitation
                ?.at(i)
        );


    if (
        Number.isFinite(
            rain
        )
    ) {

        $("rain")
            .textContent =

            rain.toFixed(1) +

            " mm";

    }


    /*
    ================================================
    WIND
    ================================================
    */


    const wind =
        Number(
            hourly
                ?.wind_speed_10m
                ?.at(i)
        );


    if (
        Number.isFinite(
            wind
        )
    ) {

        $("wind")
            .textContent =

            wind.toFixed(1) +

            " km/h";

    }


    /*
    ================================================
    CLOUDS
    ================================================
    */


    const clouds =
        Number(
            hourly
                ?.cloud_cover
                ?.at(i)
        );


    if (
        Number.isFinite(
            clouds
        )
    ) {

        $("clouds")
            .textContent =

            Math.round(
                clouds
            ) +

            "%";

    }


    /*
    ================================================
    PRESSURE
    ================================================
    */


    const pressure =
        Number(
            hourly
                ?.pressure_msl
                ?.at(i)
        );


    if (
        Number.isFinite(
            pressure
        )
    ) {

        $("pressure")
            .textContent =

            Math.round(
                pressure
            ) +

            " hPa";

    }


    status.textContent =
        "🌡 Реальная температура + Grid";

}


/*
====================================================
 LAYER BUTTONS
====================================================
*/


$("temperatureLayer")
.addEventListener(
    "click",
    () => {


        if (
            !gridVisible
        ) {

            renderTemperatureGrid();

        }


        setActive(
            "temperatureLayer"
        );


        status.textContent =
            "🌡 Temperature";


    }
);


$("gridLayer")
.addEventListener(
    "click",
    () => {


        if (
            gridVisible
        ) {

            hideGrid();

        }
        else {

            renderTemperatureGrid();

        }


        setActive(
            "gridLayer"
        );


        status.textContent =
            gridVisible

            ? "🌡 Temperature Grid"

            : "🌡 Grid hidden";


    }
);


$("rainLayer")
.addEventListener(
    "click",
    () => {


        setActive(
            "rainLayer"

        status.textContent =
            "🌧 Rain — следующий модуль";

);


$("windLayer")

$("cloudLayer")

$("pressureLayer")

/*
====================================================
 ACTIVE BUTTON
====================================================
*/


function setActive(
    id
) {


    document
        .querySelectorAll(
            ".layerButton"
        )
        .forEach(
            button => {

                button
                    .classList
                    .remove(
                        "active"
                    );

            }
        );


    $(id)
        .classList
        .add(
            "active"
        );

}


/*
====================================================
 MAIN
====================================================
*/


async function start() {


    try {


        /*
        ============================================
        MODULES
        ============================================
        */


        await loadModules();


        /*
        ============================================
        API
        ============================================
        */


        await startWeather();


        /*
        ============================================
        MAP
        ============================================
        */


        await startMap();


        /*
        ============================================
        GRID
        ============================================
        */


        createGrid();


        /*
        ============================================
        UI
        ============================================
        */


        updateWeather();


        /*
        ============================================
        TEMPERATURE RENDERER
        ============================================
        */


        renderTemperatureGrid();


        /*
        ============================================
        COORDINATES
        ============================================
        */


        const latitude =
            Number(
                weatherEngine
                    ?.location
                    ?.latitude
            );


        const longitude =
            Number(
                weatherEngine
                    ?.location
                    ?.longitude
            );


        if (
            Number.isFinite(
                latitude
            )
            &&
            Number.isFinite(
                longitude
            )
        ) {

            $("coordinates")
                .textContent =

                latitude.toFixed(4) +

                "° N, " +

                longitude.toFixed(4) +

                "° E";

        }


        /*
        ============================================
        READY
        ============================================
        */


        online.textContent =
            "● SHOHIN ONLINE";


        online.style.color =
            "#4ade80";


        systemStatus.textContent =
            "SHOHIN V5.3 • API ✓ • MAP ✓ • GRID ✓";


        loading.classList.add(
            "hidden"
        );


        console.log(
            "===================================="
        );


        console.log(
            "SHOHIN WEATHER V5.3 READY"
        );


        console.log(
            "WeatherEngine:",
            weatherEngine
        );


        console.log(
            "WeatherData:",
            weatherData
        );


        console.log(
            "WeatherGrid:",
            weatherGrid
        );


        console.log(
            "Temperature Layer:",
            temperatureLayer
        );


        console.log(
            "===================================="
        );


    }
    catch (
        error
    ) {


        console.error(
            "SHOHIN V5.3 ERROR:",
            error
        );


        online.textContent =
            "● ERROR";


        online.style.color =
            "#fb7185";


        systemStatus.textContent =
            "SHOHIN V5.3 • ERROR";


        loading.classList.add(
            "hidden"
        );


        showError(
            error
        );

    }

}


/*
====================================================
 ERROR
====================================================
*/


function showError(
    error
) {


    const message =

        error?.stack ||

        error?.message ||

        String(
            error
        );


    errorBox.textContent =

        "❌ SHOHIN WEATHER V5.3\n\n" +

        message;


    errorBox.classList.add(
        "show"
    );

}


/*
====================================================
 START
====================================================
*/


start();


</script>
