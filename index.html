================================================= */

/* =================================================

<script type="module">

/*
====================================================
 SHOHIN WEATHER V6.3
 MAIN
====================================================
*/


const $ =
id =>
document.getElementById(id);


const loading =
$("loading");

const loadingText =
$("loadingText");

const errorBox =
$("error");

const online =
$("online");

const systemStatus =
$("systemStatus");

const gridInfo =
$("gridInfo");

const status =
$("weatherStatus");


let WeatherEngine;
let MapEngine;
let WeatherGrid;

let RainLayer;
let WindLayer;
let CloudLayer;
let PressureLayer;
let UVLayer;
let StormLayer;

let RealRadarLayer;

let ForecastLayer;
let AnimationEngine;

let GlobalWeatherLayer;


let weatherEngine;
let mapEngine;
let weatherGrid;

let rainLayer;
let windLayer;
let cloudLayer;
let pressureLayer;
let uvLayer;
let stormLayer;

let realRadarLayer;

let forecastLayer;
let animationEngine;

let globalWeatherLayer;


let weatherData;

let temperatureLayer = null;

let globalVisible = false;

let radarPlaying = false;


/* =================================================
 IMPORT
================================================= */

async function loadModules(){

loadingText.textContent =
    "Загрузка модулей...";


let module;


/* WEATHER */

module =
await import(
    "./js/WeatherEngine.js"
);

WeatherEngine =
module.WeatherEngine;


/* MAP */

module =
await import(
    "./js/MapEngine.js"
);

MapEngine =
module.MapEngine;


/* GRID */

module =
await import(
    "./js/WeatherGrid.js"
);

WeatherGrid =
module.WeatherGrid;


/* RAIN */

module =
await import(
    "./js/RainLayer.js"
);

RainLayer =
module.RainLayer;


/* WIND */

module =
await import(
    "./js/WindLayer.js"
);

WindLayer =
module.WindLayer;


/* CLOUD */

module =
await import(
    "./js/CloudLayer.js"
);

CloudLayer =
module.CloudLayer;


/* PRESSURE */

module =
await import(
    "./js/PressureLayer.js"
);

PressureLayer =
module.PressureLayer;


/* UV */

module =
await import(
    "./js/UVLayer.js"
);

UVLayer =
module.UVLayer;


/* STORM */

module =
await import(
    "./js/StormLayer.js"
);

StormLayer =
module.StormLayer;


/* REAL RADAR */

module =
await import(
    "./js/RealRadarLayer.js"
);

/* FORECAST */

module =
await import(

);

ForecastLayer =
module.ForecastLayer;


/* ANIMATION */

module =
await import(
    "./js/AnimationEngine.js"
);

AnimationEngine =

/* =================================================
 GLOBAL WEATHER
================================================= */

module =
await import(
    "./js/global/GlobalWeatherLayer.js"
);

GlobalWeatherLayer =
module.GlobalWeatherLayer;

/* =================================================
 WEATHER
================================================= */

async function startWeather(){

loadingText.textContent =
    "Подключение Weather API...";


weatherEngine =
new WeatherEngine({

    latitude:
        38.5598,

    longitude:
        68.7870,

    forecastDays:
        7

});


weatherData =
await weatherEngine.load();


if(!weatherData){

    throw new Error(
        "WeatherEngine: пустой ответ"
    );

}

}


/* =================================================
 MAP
================================================= */

async function startMap(){

loadingText.textContent =
    "Создание карты...";


mapEngine =
new MapEngine({

    container:
        "map",

    latitude:
        38.5598,

    longitude:
        68.7870,

    zoom:
        6

});


await mapEngine.init();

}


/* =================================================
 GRID
================================================= */

function createGrid(){

weatherGrid =
new WeatherGrid({

    latitude:
        38.5598,

    longitude:
        68.7870,

    size:
        17,

    step:
        0.15

});


const grid =
weatherGrid.build();


const temperature =
Number(
    weatherData
    ?.hourly
    ?.temperature_2m
    ?.[0]
);


const base =
Number.isFinite(
    temperature
)
?
temperature
:
20;


weatherGrid.applyValues(

grid.map(
() =>
base
)

);


gridInfo.textContent =
"GRID " +
weatherGrid.getSize() +
" × " +
weatherGrid.getSize();

}


/* =================================================
 TEMPERATURE COLOR
================================================= */

function temperatureColor(
value
){

if(value <= -20)
return "#172554";

if(value <= -10)
return "#1d4ed8";

if(value <= 0)
return "#38bdf8";

if(value <= 10)
return "#22d3ee";

if(value <= 20)
return "#4ade80";

if(value <= 25)
return "#facc15";

if(value <= 30)
return "#fb923c";

if(value <= 35)
return "#f97316";

if(value <= 40)
return "#ef4444";

return "#991b1b";

}


/* =================================================
 TEMPERATURE GRID
================================================= */

function showTemperatureGrid(){

hideTemperatureGrid();


temperatureLayer =
L.layerGroup();


const grid =
weatherGrid.getGrid();


const step =
weatherGrid.getStep();


grid.forEach(
point => {

const value =
Number(
point.value
);


if(!Number.isFinite(value))
return;


const bounds = [

[
point.latitude -
step / 2,

point.longitude -
step / 2
],

[
point.latitude +
step / 2,

point.longitude +
step / 2
]

];


L.rectangle(
bounds,
{

stroke:
false,

fill:
true,

fillColor:
temperatureColor(
value
),

fillOpacity:
0.38,

interactive:
false

}
).addTo(
temperatureLayer
);

});


temperatureLayer.addTo(
mapEngine.map
);

}


function hideTemperatureGrid(){

if(
temperatureLayer
){

mapEngine.map
.removeLayer(
temperatureLayer
);

temperatureLayer =
null;

}

}


/* =================================================
 WEATHER INFO
================================================= */

function updateWeather(){

const h =
weatherData?.hourly;


if(!h)
return;


const t =
Number(
h.temperature_2m?.[0]
);

const hum =
Number(
h.relative_humidity_2m?.[0]
);

const rain =
Number(
h.precipitation?.[0]
);

const wind =
Number(
h.wind_speed_10m?.[0]
);

const cloud =
Number(
h.cloud_cover?.[0]
);

const pressure =
Number(
h.pressure_msl?.[0]
);

const uv =
Number(
h.uv_index?.[0]
);

const cape =
Number(
h.cape?.[0]
);


if(Number.isFinite(t))
$("temperature")
.textContent =
Math.round(t)
+
"°C";


if(Number.isFinite(hum))
$("humidity")
.textContent =
Math.round(hum)
+
"%";


if(Number.isFinite(rain))
$("rain")
.textContent =
rain.toFixed(1)
+
" mm";


if(Number.isFinite(wind))
$("wind")
.textContent =
wind.toFixed(1)
+
" km/h";


if(Number.isFinite(cloud))
$("clouds")
.textContent =
Math.round(cloud)
+
"%";


if(Number.isFinite(pressure))
$("pressure")
.textContent =
Math.round(pressure)
+
" hPa";


if(Number.isFinite(uv))
$("uv")
.textContent =
uv.toFixed(1);


if(Number.isFinite(cape))
$("cape")
.textContent =
Math.round(cape)
+
" J/kg";

}


/* =================================================
 ACTIVE BUTTON
================================================= */

function activeButton(
id
){

document
.querySelectorAll(
".layerButton"
)
.forEach(
button =>
button.classList.remove(
"active"
)
);


if($(id))
$(id).classList.add(
"active"
);

}


/* =================================================
 HIDE OLD LAYERS
================================================= */

function hideOldLayers(){

if(rainLayer)
rainLayer.hide();

if(windLayer)
windLayer.hide();

if(cloudLayer)
cloudLayer.hide();

if(pressureLayer)
pressureLayer.hide();

if(uvLayer)
uvLayer.hide();

if(stormLayer)
stormLayer.hide();

}


/* =================================================
 GLOBAL MAIN BUTTON
================================================= */

$("globalLayer")
.onclick =
async ()=>{

try{

if(
globalVisible
){

if(globalWeatherLayer)
globalWeatherLayer.hide();

globalVisible =
false;

$("globalControls")
.classList.remove(
"visible"
);

gridInfo.textContent =
"GLOBAL: OFF";

systemStatus.textContent =
"SHOHIN V6.3 • GLOBAL OFF";

return;

}


hideTemperatureGrid();

hideOldLayers();


if(realRadarLayer)
realRadarLayer.hide();


if(!globalWeatherLayer){

globalWeatherLayer =
new GlobalWeatherLayer(
mapEngine,
{

variable:
"temperature",

opacity:
0.45,

gridSize:
9,

step:
5

}
);

}


status.textContent =
"🌍 Loading Global Weather...";


systemStatus.textContent =
"SHOHIN V6.3 • GLOBAL LOADING";


await globalWeatherLayer.show();


globalVisible =
true;


$("globalControls")
.classList.add(
"visible"
);


activeButton(
"globalLayer"
);


gridInfo.textContent =
"GLOBAL: REAL DATA";

systemStatus.textContent =
"SHOHIN V6.3 • GLOBAL ✓";

status.textContent =
"🌍 Global Temperature";

}
catch(error){

showError(error);

}

};


/* =================================================
 GLOBAL VARIABLE BUTTONS
================================================= */

document
.querySelectorAll(
"[data-global]"
)
.forEach(
button => {

button.onclick =
async ()=>{

try{

const variable =
button.dataset.global;


if(!globalWeatherLayer){

globalWeatherLayer =
new GlobalWeatherLayer(
mapEngine,
{

/* =================================================
 RADAR TIME
================================================= */

function updateRadarTime(){

if(!realRadarLayer)
return;


const date =
realRadarLayer
.getCurrentTime();


if(!date){

$("radarTime")
.textContent =
"Radar: --";

return;

}


$("radarTime")
.textContent =
"Radar: " +
date.toLocaleTimeString(
"ru-RU",
{

hour:
"2-digit",

minute:
"2-digit"

}
);

}

700
);

true;

.textContent =
"⏸ Stop Radar";

};


/* =================================================
 FORECAST
================================================= */

function weatherIcon(
code
){

if(code === 0)
return "☀️";

if(code <= 3)
return "⛅";

if(code <= 48)
return "🌫️";

if(code <= 67)
return "🌧️";

if(code <= 77)
return "❄️";

if(code <= 82)
return "🌦️";

if(code >= 95)
return "⛈️";

return "🌤️";

}


function renderForecast(){

if(!forecastLayer)
return;


const days =
forecastLayer.getDays(7);


$("forecast").innerHTML =
"";


days.forEach(
day => {

const element =
document.createElement(
"div"
);

element.className =
"forecastDay";


const date =
new Date(
day.date
);


element.innerHTML = `

<div class="forecastDate">

${date.toLocaleDateString(
"ru-RU",
{
weekday:"short",
day:"2-digit",
month:"2-digit"
}
)}

</div>

<div class="forecastIcon">

${weatherIcon(
day.weatherCode
)}

</div>

<div class="forecastTemp">

${Math.round(day.min)}
°
/
${Math.round(day.max)}
°

</div>

`;


$("forecast")
.appendChild(
element
);

});

}
