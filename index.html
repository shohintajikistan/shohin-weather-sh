<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>SHOHIN Weather V5.2</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #07111f;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}

#app {

    position: relative;

    width: 100%;
    height: 100%;

}

#map {

    position: absolute;

    inset: 0;

    background: #091827;

}


/* =========================================
   TOP BAR
========================================= */

#topbar {

    position: absolute;

    top: 15px;
    left: 15px;
    right: 15px;

    height: 58px;

    z-index: 2000;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 18px;

    border-radius: 17px;

    background:
        rgba(5,15,28,.90);

    border:
        1px solid
        rgba(255,255,255,.12);

    backdrop-filter:
        blur(15px);

    color: white;

}

.logo {

    font-size: 21px;

    font-weight: 800;

}

.logo span {

    color: #38bdf8;

}

#online {

    font-size: 12px;

    color: #facc15;

}


/* =========================================
   WEATHER PANEL
========================================= */

#weatherPanel {

    position: absolute;

    z-index: 2000;

    top: 88px;
    left: 15px;

    width: 315px;

    padding: 18px;

    border-radius: 20px;

    background:
        rgba(5,15,28,.90);

    border:
        1px solid
        rgba(255,255,255,.12);

    backdrop-filter:
        blur(18px);

    color: white;

}

#location {

    font-size: 19px;

    font-weight: 700;

}

#coordinates {

    margin-top: 4px;

    color: #8fa8bd;

    font-size: 12px;

}

#temperature {

    margin-top: 14px;

    font-size: 58px;

    line-height: 1;

    font-weight: 300;

}

#weatherStatus {

    margin-top: 8px;

    color: #9eb3c6;

    font-size: 13px;

}


/* =========================================
   METRICS
========================================= */

#metrics {

    margin-top: 18px;

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 8px;

}

.metric {

    padding: 11px;

    border-radius: 12px;

    background:
        rgba(255,255,255,.06);

}

.metric-title {

    font-size: 11px;

    color: #8fa8bd;

}

.metric-value {

    margin-top: 5px;

    font-size: 15px;

    font-weight: 600;

}


/* =========================================
   GRID INFO
========================================= */

#gridInfo {

    position: absolute;

    z-index: 2000;

    right: 15px;
    bottom: 18px;

    padding:
        10px 14px;

    border-radius: 12px;

    background:
        rgba(5,15,28,.90);

    border:
        1px solid
        rgba(255,255,255,.10);

    color: #9eb3c6;

    font-size: 12px;

}


/* =========================================
   SYSTEM STATUS
========================================= */

#systemStatus {

    position: absolute;

    z-index: 2000;

    left: 15px;
    bottom: 18px;

    padding:
        9px 13px;

    border-radius: 12px;

    background:
        rgba(5,15,28,.90);

    border:
        1px solid
        rgba(255,255,255,.10);

    color: #9eb3c6;

    font-size: 12px;

}


/* =========================================
   LOADING
========================================= */

#loading {

    position: absolute;

    inset: 0;

    z-index: 5000;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    background: #07111f;

    color: white;

}

#loading.hidden {

    display: none;

}

.loader {

    width: 45px;
    height: 45px;

    border-radius: 50%;

    border:
        4px solid
        rgba(255,255,255,.12);

    border-top-color:
        #38bdf8;

    animation:
        spin .8s linear infinite;

    margin-bottom: 15px;

}

@keyframes spin {

    to {

        transform:
            rotate(360deg);

    }

}


/* =========================================
   ERROR
========================================= */

#error {

    display: none;

    position: absolute;

    z-index: 6000;

    left: 15px;
    right: 15px;

    bottom: 15px;

    max-height: 50%;

    overflow: auto;

    padding: 15px;

    border-radius: 14px;

    background:
        rgba(127,29,29,.97);

    color: white;

    white-space: pre-wrap;

    font-size: 13px;

}

#error.show {

    display: block;

}


/* =========================================
   MOBILE
========================================= */

@media (
    max-width: 650px
) {

    #topbar {

        top: 8px;
        left: 8px;
        right: 8px;

    }

    #weatherPanel {

        top: 75px;
        left: 8px;

        width: 275px;

        padding: 15px;

    }

    #temperature {

        font-size: 50px;

    }

    #gridInfo {

        right: 8px;
        bottom: 8px;

    }

    #systemStatus {

        left: 8px;
        bottom: 8px;

    }

}

</style>

</head>


<body>


<div id="app">


    <div id="map"></div>


    <div id="topbar">

        <div class="logo">

            🌍 SHOHIN
            <span>WEATHER</span>

        </div>

        <div id="online">

            ● STARTING

        </div>

    </div>


    <div id="weatherPanel">


        <div id="location">

            Dushanbe

        </div>


        <div id="coordinates">

            38.5598° N,
            68.7870° E

        </div>


        <div id="temperature">

            --°C

        </div>


        <div id="weatherStatus">

            Подключение...

        </div>


        <div id="metrics">


            <div class="metric">

                <div class="metric-title">
                    💧 Влажность
                </div>

                <div
                    id="humidity"
                    class="metric-value"
                >
                    --
                </div>

            </div>


            <div class="metric">

                <div class="metric-title">
                    🌧 Осадки
                </div>

                <div
                    id="rain"
                    class="metric-value"
                >
                    --
                </div>

            </div>


            <div class="metric">

                <div class="metric-title">
                    💨 Ветер
                </div>

                <div
                    id="wind"
                    class="metric-value"
                >
                    --
                </div>

            </div>


            <div class="metric">

                <div class="metric-title">
                    ☁ Облака
                </div>

                <div
                    id="clouds"
                    class="metric-value"
                >
                    --
                </div>

            </div>


            <div class="metric">

                <div class="metric-title">
                    🌀 Давление
                </div>

                <div
                    id="pressure"
                    class="metric-value"
                >
                    --
                </div>

            </div>


        </div>

    </div>


    <div id="systemStatus">

        SHOHIN V5.2 • Starting...

    </div>


    <div id="gridInfo">

        GRID: starting...

    </div>


    <div id="loading">

        <div class="loader"></div>

        <div>

            🌍 SHOHIN Weather V5.2

        </div>

        <div
            id="loadingText"
            style="
                margin-top:7px;
                color:#8fa8bd;
                font-size:13px;
            "
        >

            Запуск...

        </div>

    </div>


    <div id="error"></div>


</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script type="module">


/*
====================================================
 SHOHIN WEATHER V5.2
 WEATHER GRID TEST
====================================================
*/


const $ =
    id =>
        document.getElementById(id);


const loading =
    $("loading");


const loadingText =
    $("loadingText");


const errorBox =
    $("error");


const online =
    $("online");


const systemStatus =
    $("systemStatus");


const gridInfo =
    $("gridInfo");


const status =
    $("weatherStatus");


/*
====================================================
 MODULES
====================================================
*/


let WeatherEngine;

let MapEngine;

let WeatherGrid;


/*
====================================================
 STATE
====================================================
*/


let weatherEngine = null;

let mapEngine = null;

let weatherGrid = null;

let weatherData = null;


/*
====================================================
 TIMEOUT
====================================================
*/


function timeout(
    promise,
    ms,
    message
) {

    return Promise.race([

        promise,

        new Promise(
            (_, reject) => {

                setTimeout(
                    () => {

                        reject(
                            new Error(
                                message
                            )
                        );

                    },
                    ms
                );

            }
        )

    ]);

}


/*
====================================================
 LOAD CORE
====================================================
*/


async function loadCore() {


    loadingText.textContent =
        "Загрузка WeatherEngine...";


    const weatherModule =
        await timeout(

            import(
                "./js/WeatherEngine.js"
            ),

            10000,

            "WeatherEngine.js не загрузился"

        );


    WeatherEngine =
        weatherModule.WeatherEngine;


    if (
        typeof WeatherEngine !==
        "function"
    ) {

        throw new Error(
            "WeatherEngine не найден"
        );

    }


    loadingText.textContent =
        "Загрузка MapEngine...";


    const mapModule =
        await timeout(

            import(
                "./js/MapEngine.js"
            ),

            10000,

            "MapEngine.js не загрузился"

        );


    MapEngine =
        mapModule.MapEngine;


    if (
        typeof MapEngine !==
        "function"
    ) {

        throw new Error(
            "MapEngine не найден"
        );

    }


    loadingText.textContent =
        "Загрузка WeatherGrid...";


    const gridModule =
        await timeout(

            import(
                "./js/WeatherGrid.js"
            ),

            10000,

            "WeatherGrid.js не загрузился"

        );


    WeatherGrid =
        gridModule.WeatherGrid;


    if (
        typeof WeatherGrid !==
        "function"
    ) {

        throw new Error(
            "WeatherGrid не найден"
        );

    }

}


/*
====================================================
 WEATHER
====================================================
*/


async function startWeather() {


    loadingText.textContent =
        "Подключение к погодному API...";


    online.textContent =
        "● API";


    weatherEngine =
        new WeatherEngine();


    weatherData =
        await timeout(

            weatherEngine.load(),

            10000,

            "Weather API не ответил за 10 секунд"

        );


    if (
        !weatherData
    ) {

        throw new Error(
            "WeatherEngine вернул пустые данные"
        );

    }

}


/*
====================================================
 MAP
====================================================
*/


async function startMap() {


    loadingText.textContent =
        "Создание карты...";


    online.textContent =
        "● MAP";


    const latitude =
        Number(
            weatherEngine
                ?.location
                ?.latitude
        );


    const longitude =
        Number(
            weatherEngine
                ?.location
                ?.longitude
        );


    const safeLat =
        Number.isFinite(
            latitude
        )
        ? latitude
        : 38.5598;


    const safeLon =
        Number.isFinite(
            longitude
        )
        ? longitude
        : 68.7870;


    mapEngine =
        new MapEngine({

            container:
                "map",

            latitude:
                safeLat,

            longitude:
                safeLon,

            zoom:
                6

        });


    await timeout(

        mapEngine.init(),

        10000,

        "MapEngine не запустился"

    );

}


/*
====================================================
 CREATE GRID
====================================================
*/


function startGrid() {


    loadingText.textContent =
        "Создание Weather Grid...";


    const latitude =
        Number(
            weatherEngine
                ?.location
                ?.latitude
        );


    const longitude =
        Number(
            weatherEngine
                ?.location
                ?.longitude
        );


    weatherGrid =
        new WeatherGrid({

            latitude:
                Number.isFinite(
                    latitude
                )
                ? latitude
                : 38.5598,

            longitude:
                Number.isFinite(
                    longitude
                )
                ? longitude
                : 68.7870,

            size:
                15,

            step:
                0.20

        });


    const grid =
        weatherGrid.build();


    if (
        !Array.isArray(
            grid
        )
    ) {

        throw new Error(
            "WeatherGrid.build() не вернул массив"
        );

    }


    /*
    ================================================
    TEST VALUES
    ================================================
    */


    const temperature =
        Number(
            weatherData
                ?.hourly
                ?.temperature_2m
                ?.at(0)
        );


    const baseTemperature =
        Number.isFinite(
            temperature
        )
        ? temperature
        : 20;


    const values =
        grid.map(
            point => {


                const distance =
                    Math.sqrt(

                        Math.pow(

                            point.latitude -
                            latitude,

                            2

                        )

                        +

                        Math.pow(

                            point.longitude -
                            longitude,

                            2

                        )

                    );


                return (

                    baseTemperature
                    -
                    distance * 2

                );

            }
        );


    weatherGrid.applyValues(
        values
    );


    /*
    ================================================
    GRID INFO
    ================================================
    */


    gridInfo.textContent =

        "GRID: " +

        weatherGrid.getSize() +

        " × " +

        weatherGrid.getSize() +

        " • " +

        grid.length +

        " points";


    systemStatus.textContent =
        "SHOHIN V5.2 • GRID ✓";


    status.textContent =
        "🌡 Weather Grid создан";


    console.log(
        "SHOHIN WEATHER GRID:",
        weatherGrid.getGrid()
    );

}


/*
====================================================
 UPDATE WEATHER
====================================================
*/


function updateWeather() {


    const hourly =
        weatherData?.hourly;


    if (
        !hourly
    ) {

        throw new Error(
            "В API нет hourly данных"
        );

    }


    const i = 0;


    if (
        Array.isArray(
            hourly.temperature_2m
        )
    ) {

        const value =
            Number(
                hourly
                    .temperature_2m[i]
            );


        if (
            Number.isFinite(value)
        ) {

            $("temperature")
                .textContent =

                Math.round(
                    value
                ) +

                "°C";

        }

    }


    if (
        Array.isArray(
            hourly.relative_humidity_2m
        )
    ) {

        const value =
            Number(
                hourly
                    .relative_humidity_2m[i]
            );


        if (
            Number.isFinite(value)
        ) {

            $("humidity")
                .textContent =

                Math.round(
                    value
                ) +

                "%";

        }

    }


    if (
        Array.isArray(
            hourly.precipitation
        )
    ) {

        const value =
            Number(
                hourly
                    .precipitation[i]
            );


        if (
            Number.isFinite(value)
        ) {

            $("rain")
                .textContent =

                value.toFixed(1) +

                " mm";

        }

    }


    if (
        Array.isArray(
            hourly.wind_speed_10m
        )
    ) {

        const value =
            Number(
                hourly
                    .wind_speed_10m[i]
            );


        if (
            Number.isFinite(value)
        ) {

            $("wind")
                .textContent =

                value.toFixed(1) +

                " km/h";

        }

    }


    if (
        Array.isArray(
            hourly.cloud_cover
        )
    ) {

        const value =
            Number(
                hourly
                    .cloud_cover[i]
            );


        if (
            Number.isFinite(value)
        ) {

            $("clouds")
                .textContent =

                Math.round(
                    value
                ) +

                "%";

        }

    }


    if (
        Array.isArray(
            hourly.pressure_msl
        )
    ) {

        const value =
            Number(
                hourly
                    .pressure_msl[i]
            );


        if (
            Number.isFinite(value)
        ) {

            $("pressure")
                .textContent =

                Math.round(
                    value
                ) +

                " hPa";

        }

    }

}


/*
====================================================
 MAIN
====================================================
*/


async function start() {


    try {


        /*
        ============================================
        1. MODULES
        ============================================
        */


        await loadCore();


        /*
        ============================================
        2. WEATHER API
        ============================================
        */


        await startWeather();


        /*
        ============================================
        3. MAP
        ============================================
        */


        await startMap();


        /*
        ============================================
        4. GRID
        ============================================
        */


        startGrid();


        /*
        ============================================
        5. UI
        ============================================
        */


        updateWeather();


        /*
        ============================================
        LOCATION
        ============================================
        */


        const latitude =
            Number(
                weatherEngine
                    ?.location
                    ?.latitude
            );


        const longitude =
            Number(
                weatherEngine
                    ?.location
                    ?.longitude
            );


        if (
            Number.isFinite(
                latitude
            )
            &&
            Number.isFinite(
                longitude
            )
        ) {

            $("coordinates")
                .textContent =

                latitude.toFixed(4) +

                "° N, " +

                longitude.toFixed(4) +

                "° E";

        }


        /*
        ============================================
        READY
        ============================================
        */


        online.textContent =
            "● SHOHIN ONLINE";


        online.style.color =
            "#4ade80";


        loading.classList.add(
            "hidden"
        );


        console.log(
            "================================"
        );


        console.log(
            "SHOHIN WEATHER V5.2 READY"
        );


        console.log(
            "WeatherEngine:",
            weatherEngine
        );


        console.log(
            "WeatherData:",
            weatherData
        );


        console.log(
            "WeatherGrid:",
            weatherGrid
        );


        console.log(
            "Grid:",
            weatherGrid.getGrid()
        );


        console.log(
            "================================"
        );


    }
    catch (
        error
    ) {


        console.error(
            "SHOHIN V5.2 ERROR:",
            error
        );


        online.textContent =
            "● ERROR";


        online.style.color =
            "#fb7185";


        loading.classList.add(
            "hidden"
        );


        systemStatus.textContent =
            "SHOHIN V5.2 • ERROR";


        showError(
            error
        );

    }

}


/*
====================================================
 ERROR
====================================================
*/


function showError(
    error
) {


    const message =

        error?.stack ||

        error?.message ||

        String(
            error
        );


    errorBox.textContent =

        "❌ SHOHIN WEATHER V5.2\n\n" +

        message;


    errorBox.classList.add(
        "show"
    );

}


/*
====================================================
 START
====================================================
*/


start();


</script>

</body>

</html>
