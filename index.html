<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>SHOHIN Weather V5</title>

<!-- Leaflet -->
<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    width: 100%;
    height: 100%;

    background: #07111f;

    font-family:
        Arial,
        sans-serif;

}

#app {

    width: 100%;
    height: 100%;

    position: relative;

}

#map {

    position: absolute;

    inset: 0;

}

#panel {

    position: absolute;

    z-index: 1000;

    top: 20px;
    left: 20px;

    width: 300px;

    padding: 20px;

    border-radius: 20px;

    background:
        rgba(5,15,28,.88);

    color: white;

    backdrop-filter:
        blur(15px);

    box-shadow:
        0 15px 50px
        rgba(0,0,0,.35);

}

.logo {

    font-size: 22px;

    font-weight: 800;

}

.logo span {

    color: #38bdf8;

}

.location {

    margin-top: 18px;

    font-size: 18px;

    font-weight: 700;

}

.temperature {

    margin-top: 8px;

    font-size: 54px;

    font-weight: 300;

}

.status {

    margin-top: 8px;

    color: #8fa8bd;

    font-size: 13px;

}

.metrics {

    margin-top: 18px;

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 8px;

}

.metric {

    padding: 10px;

    border-radius: 12px;

    background:
        rgba(255,255,255,.07);

}

.metric small {

    display: block;

    color: #8fa8bd;

    margin-bottom: 4px;

}

.metric strong {

    font-size: 14px;

}

#loading {

    position: fixed;

    inset: 0;

    z-index: 5000;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        #07111f;

    color: white;

    font-size: 18px;

}

#loading.hidden {

    display: none;

}

</style>

</head>


<body>


<div id="app">


    <div id="map"></div>


    <div id="panel">

        <div class="logo">

            🌍 SHOHIN
            <span>WEATHER</span>

        </div>


        <div
            id="location"
            class="location"
        >

            Dushanbe

        </div>


        <div
            id="temperature"
            class="temperature"
        >

            --°

        </div>


        <div
            id="status"
            class="status"
        >

            Запуск SHOHIN Weather V5...

        </div>


        <div class="metrics">


            <div class="metric">

                <small>💧 Влажность</small>

                <strong id="humidity">
                    --
                </strong>

            </div>


            <div class="metric">

                <small>🌧 Осадки</small>

                <strong id="rain">
                    --
                </strong>

            </div>


            <div class="metric">

                <small>💨 Ветер</small>

                <strong id="wind">
                    --
                </strong>

            </div>


            <div class="metric">

                <small>☁ Облака</small>

                <strong id="clouds">
                    --
                </strong>

            </div>


            <div class="metric">

                <small>🌀 Давление</small>

                <strong id="pressure">
                    --
                </strong>

            </div>


        </div>

    </div>


    <div
        id="loading"
    >

        🌍 Запуск SHOHIN Weather...

    </div>


</div>


<!-- Leaflet JS -->

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>


<!-- SHOHIN V5 -->

<script type="module">


import {
    WeatherEngine
}
from "./js/WeatherEngine.js";


import {
    MapEngine
}
from "./js/MapEngine.js";


/*
========================================
 SHOHIN WEATHER V5
 START
========================================
*/


const status =
    document.getElementById(
        "status"
    );


const loading =
    document.getElementById(
        "loading"
    );


const temperature =
    document.getElementById(
        "temperature"
    );


const humidity =
    document.getElementById(
        "humidity"
    );


const rain =
    document.getElementById(
        "rain"
    );


const wind =
    document.getElementById(
        "wind"
    );


const clouds =
    document.getElementById(
        "clouds"
    );


const pressure =
    document.getElementById(
        "pressure"
    );


try {


    /*
    ================================
    1. WEATHER ENGINE
    ================================
    */

    const weather =
        new WeatherEngine();


    status.textContent =
        "Получение погодных данных...";


    const data =
        await weather.load();


    /*
    ================================
    2. MAP ENGINE
    ================================
    */

    const map =
        new MapEngine({

            container: "map",

            latitude:
                weather.location.latitude,

            longitude:
                weather.location.longitude,

            zoom: 6

        });


    await map.init();


    /*
    ================================
    3. WEATHER DATA
    ================================
    */

    const hourly =
        data.hourly;


    const i = 0;


    if (
        hourly.temperature_2m
    ) {

        temperature.textContent =
            Math.round(
                hourly
                    .temperature_2m[i]
            ) +
            "°C";

    }


    if (
        hourly.relative_humidity_2m
    ) {

        humidity.textContent =
            Math.round(
                hourly
                    .relative_humidity_2m[i]
            ) +
            "%";

    }


    if (
        hourly.precipitation
    ) {

        rain.textContent =
            Number(
                hourly
                    .precipitation[i]
            ).toFixed(1) +
            " mm";

    }


    if (
        hourly.wind_speed_10m
    ) {

        wind.textContent =
            Number(
                hourly
                    .wind_speed_10m[i]
            ).toFixed(1) +
            " km/h";

    }


    if (
        hourly.cloud_cover
    ) {

        clouds.textContent =
            Math.round(
                hourly
                    .cloud_cover[i]
            ) +
            "%";

    }


    if (
        hourly.pressure_msl
    ) {

        pressure.textContent =
            Math.round(
                hourly
                    .pressure_msl[i]
            ) +
            " hPa";

    }


    /*
    ================================
    READY
    ================================
    */

    status.textContent =
        "✓ SHOHIN Weather V5 ONLINE";


    loading.classList
        .add(
            "hidden"
        );


}
catch (
    error
) {


    console.error(
        "SHOHIN V5 ERROR:",
        error
    );


    status.textContent =
        "❌ Ошибка запуска";


    loading.textContent =
        "❌ " +
        error.message;

}

</script>


</body>

</html>
