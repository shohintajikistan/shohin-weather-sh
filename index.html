<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               viewport-fit=cover">

<meta name="theme-color" content="#07121f">

<title>SHOHIN Weather V2</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#07121f;
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

#map{
    position:fixed;
    inset:0;
}

/* =========================
   TOP BAR
========================= */

.topbar{

    position:fixed;

    top:
        max(12px,env(safe-area-inset-top));

    left:12px;
    right:12px;

    z-index:20;

    display:flex;
    align-items:center;

    gap:10px;

    pointer-events:none;
}

.logo{

    pointer-events:auto;

    padding:
        11px 15px;

    border-radius:17px;

    background:
        rgba(5,16,29,.82);

    border:
        1px solid
        rgba(255,255,255,.13);

    backdrop-filter:
        blur(18px);

    color:white;

    box-shadow:
        0 12px 40px
        rgba(0,0,0,.25);
}

.logo strong{

    display:block;

    font-size:16px;

    font-weight:850;
}

.logo small{

    display:block;

    margin-top:2px;

    font-size:8px;

    letter-spacing:1.1px;

    opacity:.55;
}

#close{

    margin-left:auto;

    pointer-events:auto;

    width:44px;
    height:44px;

    border-radius:50%;

    border:
        1px solid
        rgba(255,255,255,.13);

    background:
        rgba(5,16,29,.84);

    color:white;

    cursor:pointer;

    backdrop-filter:
        blur(18px);
}

/* =========================
   WEATHER PANEL
========================= */

.panel{

    position:fixed;

    top:82px;
    left:12px;

    z-index:20;

    width:285px;

    max-height:
        calc(100vh - 185px);

    overflow:auto;

    padding:12px;

    border-radius:21px;

    background:
        rgba(5,16,29,.83);

    border:
        1px solid
        rgba(255,255,255,.12);

    backdrop-filter:
        blur(20px);

    color:white;

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.32);
}

.title{

    margin:
        4px 4px 8px;

    font-size:9px;

    letter-spacing:1.1px;

    text-transform:uppercase;

    opacity:.5;
}

.layers{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:7px;
}

.layer{

    border:
        1px solid
        rgba(255,255,255,.09);

    border-radius:13px;

    padding:10px 8px;

    background:
        rgba(255,255,255,.055);

    color:white;

    cursor:pointer;

    text-align:left;

    font-size:11px;
}

.layer b{

    display:block;

    font-size:18px;

    margin-bottom:3px;
}

.layer.active{

    background:
        rgba(255,255,255,.17);

    border-color:
        rgba(255,255,255,.28);
}

/* =========================
   WEATHER INFO
========================= */

.info{

    display:none;

    margin-top:10px;

    padding:12px;

    border-radius:16px;

    background:
        rgba(255,255,255,.055);
}

.location{

    font-size:15px;

    font-weight:800;
}

.coords{

    margin-top:3px;

    font-size:9px;

    opacity:.45;
}

.temp{

    margin:
        12px 0;

    font-size:39px;

    line-height:1;

    font-weight:850;
}

.metrics{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:6px;
}

.metric{

    padding:8px;

    border-radius:10px;

    background:
        rgba(255,255,255,.055);

    font-size:9px;

    opacity:.8;
}

.metric b{

    display:block;

    margin-top:3px;

    font-size:11px;

    opacity:1;
}

#chart{

    width:100%;

    height:105px;

    display:block;

    margin-top:10px;
}

/* =========================
   TIME BAR
========================= */

.timeline{

    position:fixed;

    z-index:20;

    left:12px;
    right:12px;

    bottom:
        max(12px,env(safe-area-inset-bottom));

    padding:11px;

    border-radius:19px;

    background:
        rgba(5,16,29,.84);

    border:
        1px solid
        rgba(255,255,255,.12);

    backdrop-filter:
        blur(20px);

    box-shadow:
        0 15px 50px
        rgba(0,0,0,.3);

    color:white;
}

.timeRow{

    display:flex;

    align-items:center;

    gap:9px;
}

#play{

    width:42px;
    height:42px;

    flex:0 0 auto;

    border:0;

    border-radius:50%;

    background:white;

    color:#07121f;

    font-weight:800;

    cursor:pointer;
}

#time{

    flex:1;

    accent-color:white;
}

#timeText{

    width:100px;

    text-align:right;

    font-size:9px;

    opacity:.7;
}

.legend{

    display:flex;

    align-items:center;

    gap:8px;

    margin-top:8px;

    font-size:8px;

    opacity:.55;
}

.gradient{

    flex:1;

    height:6px;

    border-radius:20px;

    background:
        linear-gradient(
            90deg,
            #2454a6,
            #4ca7dc,
            #9bd6a0,
            #ffff91,
            #f6a44d,
            #df3333
        );
}

/* =========================
   MAP BUTTON
========================= */

.mapButtons{

    position:fixed;

    right:12px;

    bottom:105px;

    z-index:21;

    display:flex;

    flex-direction:column;

    gap:7px;
}

.mapButton{

    width:45px;
    height:45px;

    border-radius:14px;

    border:
        1px solid
        rgba(255,255,255,.13);

    background:
        rgba(5,16,29,.83);

    color:white;

    backdrop-filter:
        blur(15px);

    cursor:pointer;

    font-size:18px;
}

/* =========================
   LOADING
========================= */

#loading{

    position:fixed;

    inset:0;

    z-index:100;

    display:none;

    align-items:center;

    justify-content:center;

    pointer-events:none;
}

#loading.show{

    display:flex;
}

.spinner{

    width:38px;
    height:38px;

    border:
        3px solid
        rgba(255,255,255,.18);

    border-top-color:white;

    border-radius:50%;

    animation:
        spin .7s linear infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .panel{

        width:238px;

        top:72px;
    }

    .temp{

        font-size:31px;
    }

    .timeline{

        left:7px;
        right:7px;
        bottom:7px;
    }

    #timeText{

        width:82px;

        font-size:8px;
    }

}

</style>
</head>

<body>

<div id="map"></div>

<!-- TOP -->

<div class="topbar">

    <div class="logo">

        <strong>
            🌍 SHOHIN Weather
        </strong>

        <small>
            GLOBAL METEOROLOGICAL SYSTEM
        </small>

    </div>

    <button id="close">
        ✕
    </button>

</div>

<!-- WEATHER PANEL -->

<div class="panel">

    <div class="title">
        Weather Layers
    </div>

    <div class="layers">

        <button
            class="layer active"
            data-layer="temperature">

            <b>🌡️</b>
            Temperature

        </button>

        <button
            class="layer"
            data-layer="rain">

            <b>🌧️</b>
            Rain

        </button>

        <button
            class="layer"
            data-layer="wind">

            <b>💨</b>
            Wind

        </button>

        <button
            class="layer"
            data-layer="cloud">

            <b>☁️</b>
            Clouds

        </button>

        <button
            class="layer"
            data-layer="pressure">

            <b>🌀</b>
            Pressure

        </button>

        <button
            class="layer"
            data-layer="humidity">

            <b>💧</b>
            Humidity

        </button>

    </div>

    <div class="info" id="info">

        <div
            class="location"
            id="location">

            Dushanbe

        </div>

        <div
            class="coords"
            id="coords">

            38.5598, 68.7870

        </div>

        <div
            class="temp"
            id="temp">

            --°

        </div>

        <div class="metrics">

            <div class="metric">
                💧 Humidity
                <b id="humidity">
                    --%
                </b>
            </div>

            <div class="metric">
                💨 Wind
                <b id="wind">
                    -- km/h
                </b>
            </div>

            <div class="metric">
                🌧️ Rain
                <b id="rain">
                    -- mm
                </b>
            </div>

            <div class="metric">
                🌀 Pressure
                <b id="pressure">
                    -- hPa
                </b>
            </div>

            <div class="metric">
                ☁️ Clouds
                <b id="cloud">
                    --%
                </b>
            </div>

            <div class="metric">
                🧭 Direction
                <b id="direction">
                    --°
                </b>
            </div>

        </div>

        <canvas id="chart"></canvas>

    </div>

</div>

<!-- MAP CONTROLS -->

<div class="mapButtons">

    <button
        class="mapButton"
        id="globe">
        🌐
    </button>

    <button
        class="mapButton"
        id="gps">
        📍
    </button>

</div>

<!-- TIMELINE -->

<div class="timeline">

    <div class="timeRow">

        <button id="play">
            ▶
        </button>

        <input
            id="time"
            type="range"
            min="0"
            max="23"
            value="0">

        <div id="timeText">
            Loading...
        </div>

    </div>

    <div class="legend">

        <span>Cold</span>

        <div class="gradient"></div>

        <span>Hot</span>

    </div>

</div>

<div id="loading">

    <div class="spinner"></div>

</div>

<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>

<script>

/* =========================================================
   SHOHIN WEATHER V2
   REAL WEBGL MAP ENGINE
========================================================= */

"use strict";


/* =========================================================
   STATE
========================================================= */

const state = {

    lat:38.5598,

    lon:68.7870,

    layer:"temperature",

    hour:0,

    weather:null,

    playing:false,

    timer:null

};

const cache = new Map();


/* =========================================================
   ELEMENTS
========================================================= */

const $ = id =>
    document.getElementById(id);

const info =
    $("info");

const loading =
    $("loading");


/* =========================================================
   MAP STYLE
========================================================= */

const style = {

    version:8,

    sources:{

        osm:{

            type:"raster",

            tiles:[
                "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
            ],

            tileSize:256,

            attribution:
                "© OpenStreetMap contributors"

        }

    },

    layers:[

        {

            id:"osm",

            type:"raster",

            source:"osm",

            paint:{

                "raster-opacity":1

            }

        }

    ]

};


/* =========================================================
   MAP
========================================================= */

const map =
    new maplibregl.Map({

        container:"map",

        style:style,

        center:[
            state.lon,
            state.lat
        ],

        zoom:3.1,

        minZoom:1,

        maxZoom:18,

        attributionControl:false

    });


/* =========================================================
   CONTROLS
========================================================= */

map.addControl(
    new maplibregl.NavigationControl({
        showCompass:true,
        showZoom:true,
        visualizePitch:true
    }),
    "bottom-right"
);


/* =========================================================
   WEATHER CANVAS
========================================================= */

let weatherCanvas = null;

let weatherContext = null;


function createWeatherCanvas(){

    if(weatherCanvas)
        return;

    weatherCanvas =
        document.createElement("canvas");

    weatherCanvas.style.position =
        "absolute";

    weatherCanvas.style.inset =
        "0";

    weatherCanvas.style.width =
        "100%";

    weatherCanvas.style.height =
        "100%";

    weatherCanvas.style.pointerEvents =
        "none";

    weatherCanvas.style.zIndex =
        "2";

    document
        .getElementById("map")
        .appendChild(
            weatherCanvas
        );

    weatherContext =
        weatherCanvas.getContext("2d");

    resizeWeatherCanvas();

}


function resizeWeatherCanvas(){

    if(!weatherCanvas)
        return;

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    const rect =
        document
        .getElementById("map")
        .getBoundingClientRect();

    weatherCanvas.width =
        rect.width*dpr;

    weatherCanvas.height =
        rect.height*dpr;

    weatherCanvas.style.width =
        rect.width+"px";

    weatherCanvas.style.height =
        rect.height+"px";

    weatherContext.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    drawWeather();

}


window.addEventListener(
    "resize",
    resizeWeatherCanvas
);


/* =========================================================
   MAP LOAD
========================================================= */

map.on(
    "load",
    ()=>{

        createWeatherCanvas();

        loadWeather(
            state.lat,
            state.lon
        );

        addLocationMarker();

    }
);


/* =========================================================
   LOCATION MARKER
========================================================= */

let marker = null;


function addLocationMarker(){

    marker =
        new maplibregl.Marker({
            color:"#ffffff"
        })
        .setLngLat([
            state.lon,
            state.lat
        ])
        .addTo(map);

}


/* =========================================================
   CLICK MAP
========================================================= */

map.on(
    "click",
    async event=>{

        state.lon =
            event.lngLat.lng;

        state.lat =
            event.lngLat.lat;

        if(marker){

            marker.setLngLat([
                state.lon,
                state.lat
            ]);

        }

        state.hour=0;

        $("time").value=0;

        updateCoordinates();

        await loadWeather(
            state.lat,
            state.lon
        );

    }
);


/* =========================================================
   OPEN-METEO
========================================================= */

async function loadWeather(
    lat,
    lon
){

    const key =
        `${lat.toFixed(2)},${lon.toFixed(2)}`;

    if(cache.has(key)){

        state.weather =
            cache.get(key);

        updateUI();

        drawWeather();

        return;

    }

    loading.classList.add(
        "show"
    );

    try{

        const params = [

            "temperature_2m",

            "relative_humidity_2m",

            "precipitation",

            "cloud_cover",

            "pressure_msl",

            "wind_speed_10m",

            "wind_direction_10m"

        ].join(",");


        const url =
            "https://api.open-meteo.com/v1/forecast"+
            `?latitude=${encodeURIComponent(lat)}`+
            `&longitude=${encodeURIComponent(lon)}`+
            `&hourly=${params}`+
            "&forecast_days=2"+
            "&timezone=auto";


        const response =
            await fetch(url);


        if(!response.ok)
            throw new Error(
                "Weather API error"
            );


        const result =
            await response.json();


        state.weather =
            result;


        cache.set(
            key,
            result
        );


        updateUI();

        drawWeather();

    }
    catch(error){

        console.error(
            "SHOHIN WEATHER",
            error
        );

    }
    finally{

        loading.classList.remove(
            "show"
        );

    }

}


/* =========================================================
   UI
========================================================= */

function updateUI(){

    const h =
        state.weather?.hourly;

    if(!h)
        return;


    info.style.display =
        "block";


    const i =
        Math.min(
            state.hour,
            h.time.length-1
        );


    $("temp").textContent =
        `${Math.round(
            h.temperature_2m[i]
        )}°`;


    $("humidity").textContent =
        `${Math.round(
            h.relative_humidity_2m[i]
        )}%`;


    $("wind").textContent =
        `${Math.round(
            h.wind_speed_10m[i]
        )} km/h`;


    $("rain").textContent =
        `${Number(
            h.precipitation[i]
        ).toFixed(1)} mm`;


    $("pressure").textContent =
        `${Math.round(
            h.pressure_msl[i]
        )} hPa`;


    $("cloud").textContent =
        `${Math.round(
            h.cloud_cover[i]
        )}%`;


    $("direction").textContent =
        `${Math.round(
            h.wind_direction_10m[i]
        )}°`;


    $("coords").textContent =
        `${state.lat.toFixed(4)}, `+
        `${state.lon.toFixed(4)}`;


    const date =
        new Date(
            h.time[i]
        );


    $("timeText").textContent =
        date.toLocaleString(
            undefined,
            {
                weekday:"short",
                hour:"2-digit",
                minute:"2-digit"
            }
        );


    drawChart();

}


/* =========================================================
   WEATHER VISUALIZATION
========================================================= */

function drawWeather(){

    if(!weatherCanvas)
        return;

    resizeWeatherCanvasInternal();

    const ctx =
        weatherContext;

    const width =
        weatherCanvas.clientWidth;

    const height =
        weatherCanvas.clientHeight;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /*
       We don't paint giant opaque blocks.

       Instead we create a very light
       atmospheric overlay.

       The real map remains clearly visible.
    */


    if(state.layer==="wind"){

        drawWind(
            ctx,
            width,
            height
        );

        return;

    }


    if(state.layer==="rain"){

        drawRain(
            ctx,
            width,
            height
        );

        return;

    }


    if(state.layer==="cloud"){

        drawClouds(
            ctx,
            width,
            height
        );

        return;

    }


    /*
       Temperature / humidity /
       pressure visual atmosphere.
    */

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            width,
            height
        );


    if(state.layer==="temperature"){

        gradient.addColorStop(
            0,
            "rgba(20,90,220,.18)"
        );

        gradient.addColorStop(
            .35,
            "rgba(50,180,220,.08)"
        );

        gradient.addColorStop(
            .5,
            "rgba(255,230,80,.10)"
        );

        gradient.addColorStop(
            .75,
            "rgba(255,120,30,.12)"
        );

        gradient.addColorStop(
            1,
            "rgba(220,30,40,.18)"
        );

    }


    else if(state.layer==="humidity"){

        gradient.addColorStop(
            0,
            "rgba(20,120,255,.15)"
        );

        gradient.addColorStop(
            .5,
            "rgba(30,210,220,.10)"
        );

        gradient.addColorStop(
            1,
            "rgba(80,100,255,.18)"
        );

    }


    else{

        gradient.addColorStop(
            0,
            "rgba(170,70,255,.10)"
        );

        gradient.addColorStop(
            .5,
            "rgba(90,130,255,.08)"
        );

        gradient.addColorStop(
            1,
            "rgba(220,80,255,.12)"
        );

    }


    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        width,
        height
    );

}


/* =========================================================
   INTERNAL RESIZE
========================================================= */

function resizeWeatherCanvasInternal(){

    if(!weatherCanvas)
        return;

    const rect =
        document
        .getElementById("map")
        .getBoundingClientRect();

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    if(
        weatherCanvas.width !==
        rect.width*dpr ||
        weatherCanvas.height !==
        rect.height*dpr
    ){

        weatherCanvas.width =
            rect.width*dpr;

        weatherCanvas.height =
            rect.height*dpr;

        weatherContext.setTransform(
            dpr,
            0,
            0,
            dpr,
            0,
            0
        );

    }

}


/* =========================================================
   WIND
========================================================= */

const particles = [];

for(
    let i=0;
    i<180;
    i++
){

    particles.push({

        x:Math.random(),

        y:Math.random(),

        speed:
            .001+
            Math.random()*.003

    });

}


function drawWind(
    ctx,
    width,
    height
){

    ctx.strokeStyle =
        "rgba(255,255,255,.38)";

    ctx.lineWidth=1.1;


    for(
        const p of particles
    ){

        p.x +=
            p.speed;


        if(p.x>1)
            p.x=0;


        const x =
            p.x*width;

        const y =
            p.y*height;


        ctx.beginPath();

        ctx.moveTo(
            x,
            y
        );

        ctx.lineTo(
            x+18,
            y-5
        );

        ctx.stroke();

    }

}


/* =========================================================
   RAIN
========================================================= */

function drawRain(
    ctx,
    width,
    height
){

    ctx.fillStyle =
        "rgba(40,150,255,.25)";


    for(
        let i=0;
        i<350;
        i++
    ){

        const x =
            (i*83+
             state.hour*18)
            %width;

        const y =
            (i*47+
             state.hour*30)
            %height;


        ctx.fillRect(
            x,
            y,
            2,
            9
        );

    }

}


/* =========================================================
   CLOUDS
========================================================= */

function drawClouds(
    ctx,
    width,
    height
){

    ctx.fillStyle =
        "rgba(235,240,245,.11)";


    for(
        let i=0;
        i<45;
        i++
    ){

        const x =
            (
                i*131+
                state.hour*12
            )%width;

        const y =
            (
                i*73
            )%height;


        const radius =
            25+
            (i%5)*10;


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            radius,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

}


/* =========================================================
   CHART
========================================================= */

function drawChart(){

    if(!state.weather)
        return;


    const values =
        state.weather
        .hourly
        .temperature_2m
        .slice(0,24);


    const width =
        chart.clientWidth;

    const height =
        chart.clientHeight;


    const dpr =
        Math.min(
            window.devicePixelRatio||1,
            2
        );


    chart.width =
        width*dpr;

    chart.height =
        height*dpr;


    const ctx =
        chart.getContext("2d");


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    const min =
        Math.min(...values)-2;

    const max =
        Math.max(...values)+2;


    ctx.strokeStyle =
        "rgba(255,255,255,.08)";

    ctx.lineWidth=1;


    for(
        let i=1;
        i<4;
        i++
    ){

        const y =
            height*i/4;


        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            width,
            y
        );

        ctx.stroke();

    }


    ctx.beginPath();


    values.forEach(
        (value,i)=>{

            const x =
                4+
                i/
                (values.length-1)*
                (width-8);


            const y =
                height-
                (
                    (value-min)/
                    (max-min)
                )*
                (height-12)-
                6;


            if(i===0)
                ctx.moveTo(
                    x,
                    y
                );
            else
                ctx.lineTo(
                    x,
                    y
                );

        }
    );


    ctx.strokeStyle =
        "#ffffff";

    ctx.lineWidth=2;

    ctx.stroke();

}


/* =========================================================
   LAYERS
========================================================= */

document
.querySelectorAll(".layer")
.forEach(
    button=>{

        button.addEventListener(
            "click",
            ()=>{

                document
                .querySelectorAll(".layer")
                .forEach(
                    b=>
                    b.classList.remove(
                        "active"
                    )
                );


                button.classList.add(
                    "active"
                );


                state.layer =
                    button.dataset.layer;


                drawWeather();

            }
        );

    }
);


/* =========================================================
   TIME
========================================================= */

$("time")
.addEventListener(
    "input",
    ()=>{

        state.hour =
            Number(
                $("time").value
            );

        updateUI();

        drawWeather();

    }
);


/* =========================================================
   PLAY
========================================================= */

$("play")
.addEventListener(
    "click",
    ()=>{

        if(state.playing){

            clearInterval(
                state.timer
            );

            state.timer=null;

            state.playing=false;

            $("play").textContent="▶";

            return;

        }


        state.playing=true;

        $("play").textContent="❚❚";


        state.timer =
            setInterval(
                ()=>{

                    state.hour++;

                    if(
                        state.hour>23
                    )
                        state.hour=0;


                    $("time").value =
                        state.hour;


                    updateUI();

                    drawWeather();

                },
                550
            );

    }
);


/* =========================================================
   GLOBE MODE
========================================================= */

$("globe")
.addEventListener(
    "click",
    ()=>{

        const current =
            map.getProjection();


        /*
           MapLibre supports globe
           projection on supported styles.
        */

        try{

            map.setProjection({
                type:"globe"
            });

        }
        catch(error){

            console.warn(
                "Globe projection unavailable",
                error
            );

        }

    }
);


/* =========================================================
   GPS
========================================================= */

$("gps")
.addEventListener(
    "click",
    ()=>{

        if(
            !navigator.geolocation
        ){

            alert(
                "GPS не поддерживается"
            );

            return;

        }


        navigator
        .geolocation
        .getCurrentPosition(
            position=>{

                state.lat =
                    position
                    .coords
                    .latitude;

                state.lon =
                    position
                    .coords
                    .longitude;


                map.flyTo({

                    center:[
                        state.lon,
                        state.lat
                    ],

                    zoom:8,

                    speed:.8,

                    curve:1.2

                });


                if(marker){

                    marker.setLngLat([
                        state.lon,
                        state.lat
                    ]);

                }


                loadWeather(
                    state.lat,
                    state.lon
                );

            },

            error=>{

                console.warn(
                    "GPS:",
                    error
                );

            },

            {

                enableHighAccuracy:true,

                timeout:10000,

                maximumAge:30000

            }

        );

    }
);


/* =========================================================
   START
========================================================= */

window.addEventListener(
    "resize",
    ()=>{
        if(map)
            map.resize();

        drawWeather();

    }
);

</script>

</body>
</html>
