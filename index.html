<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SHOHIN Weather V5</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            font-family:
                Arial,
                sans-serif;

            background:
                #07111f;

            color: white;

        }

        body {

            display: flex;

            align-items: center;

            justify-content: center;

        }

        .box {

            text-align: center;

            padding: 40px;

        }

        .logo {

            font-size: 42px;

            font-weight: 800;

            margin-bottom: 15px;

        }

        .logo span {

            color: #38bdf8;

        }

        .status {

            font-size: 18px;

            color: #9fb4c8;

            margin-top: 15px;

        }

        .online {

            display: inline-block;

            margin-top: 25px;

            padding: 10px 18px;

            border-radius: 20px;

            background:
                rgba(34,197,94,.15);

            color: #4ade80;

        }

    </style>

</head>


<body>


    <div class="box">

        <div class="logo">

            🌍 SHOHIN
            <span>WEATHER</span>

        </div>


        <div class="status">

            V5 запускается...

        </div>


        <div class="online">

            ● SYSTEM ONLINE

        </div>

    </div>


</body>

</html>
