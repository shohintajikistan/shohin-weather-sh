<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<meta name="theme-color" content="#07111f">

<title>SHOHIN WEATHER V4</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body,
#app,
#map{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    background:#07111f;
    color:white;
}

#app{
    position:relative;
    overflow:hidden;
}

#map{
    position:absolute;
    inset:0;
    z-index:1;
}

/* =========================================
   TOP
========================================= */

.topbar{
    position:absolute;
    z-index:1000;
    top:12px;
    left:12px;
    right:12px;

    display:flex;
    gap:9px;
    align-items:center;

    pointer-events:none;
}

.brand{
    pointer-events:auto;

    display:flex;
    align-items:center;
    gap:9px;

    padding:8px 12px;

    border-radius:17px;

    background:rgba(5,15,28,.88);

    border:1px solid rgba(255,255,255,.12);

    backdrop-filter:blur(18px);

    box-shadow:
        0 10px 35px rgba(0,0,0,.3);
}

.brand-icon{
    width:36px;
    height:36px;

    display:grid;
    place-items:center;

    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            #ff9f1c,
            #ff5635
        );

    font-size:20px;
}

.brand-title{
    font-size:13px;
    font-weight:900;
    letter-spacing:.7px;
}

.brand-sub{
    font-size:8px;
    opacity:.55;
    margin-top:2px;
}

/* =========================================
   SEARCH
========================================= */

.search{
    position:relative;
    flex:1;
    max-width:550px;

    pointer-events:auto;
}

#searchInput{
    width:100%;
    height:45px;

    border:1px solid rgba(255,255,255,.13);
    outline:none;

    border-radius:15px;

    padding:0 15px 0 43px;

    background:rgba(5,15,28,.88);
    color:white;

    font-size:14px;

    backdrop-filter:blur(18px);

    box-shadow:
        0 10px 35px rgba(0,0,0,.3);
}

#searchInput::placeholder{
    color:rgba(255,255,255,.55);
}

.search-icon{
    position:absolute;
    left:15px;
    top:50%;
    transform:translateY(-50%);
    opacity:.7;
}

#results{
    position:absolute;

    left:0;
    right:0;
    top:51px;

    display:none;

    max-height:320px;
    overflow:auto;

    border-radius:15px;

    background:rgba(5,15,28,.96);

    border:1px solid rgba(255,255,255,.12);

    backdrop-filter:blur(20px);
}

.result{
    padding:12px 15px;
    cursor:pointer;

    border-bottom:
        1px solid rgba(255,255,255,.06);
}

.result:hover{
    background:rgba(255,255,255,.08);
}

.result strong{
    display:block;
    font-size:13px;
}

.result small{
    display:block;
    margin-top:3px;
    opacity:.55;
    font-size:10px;
}

/* =========================================
   LAYERS
========================================= */

.layers{
    position:absolute;

    z-index:900;

    top:68px;
    right:12px;

    display:flex;
    gap:5px;

    max-width:
        calc(100% - 24px);

    overflow-x:auto;

    padding:5px;

    border-radius:15px;

    background:rgba(5,15,28,.85);

    border:1px solid rgba(255,255,255,.12);

    backdrop-filter:blur(18px);
}

.layer{
    flex:0 0 auto;

    height:35px;

    padding:0 12px;

    border:0;

    border-radius:10px;

    background:transparent;

    color:white;

    opacity:.65;

    font-size:11px;
    font-weight:700;

    cursor:pointer;
}

.layer:hover{
    background:rgba(255,255,255,.08);
    opacity:1;
}

.layer.active{
    opacity:1;

    background:
        linear-gradient(
            135deg,
            #ff9f1c,
            #ff5935
        );

    box-shadow:
        0 5px 18px rgba(255,120,30,.25);
}

/* =========================================
   WEATHER CARD
========================================= */

.card{
    position:absolute;

    z-index:950;

    left:15px;
    bottom:82px;

    width:315px;
    max-width:calc(100% - 30px);

    padding:17px;

    border-radius:23px;

    background:rgba(5,15,28,.88);

    border:1px solid rgba(255,255,255,.12);

    backdrop-filter:blur(22px);

    box-shadow:
        0 20px 60px rgba(0,0,0,.38);
}

.card-head{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.location{
    font-size:17px;
    font-weight:900;
}

.coords{
    margin-top:4px;
    font-size:9px;
    opacity:.5;
}

.close{
    width:30px;
    height:30px;

    border:0;
    border-radius:10px;

    background:rgba(255,255,255,.08);
    color:white;

    font-size:18px;

    cursor:pointer;
}

.temp{
    margin-top:14px;

    font-size:48px;
    line-height:1;

    font-weight:900;

    letter-spacing:-2px;
}

.description{
    margin-top:7px;

    font-size:13px;
    opacity:.72;
}

.weather-grid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:8px;

    margin-top:16px;
}

.weather-item{
    padding:10px;

    border-radius:13px;

    background:rgba(255,255,255,.06);
}

.weather-item span{
    display:block;
    font-size:9px;
    opacity:.5;
}

.weather-item strong{
    display:block;

    margin-top:4px;

    font-size:13px;
}

/* =========================================
   CONTROLS
========================================= */

.controls{
    position:absolute;

    z-index:950;

    right:12px;
    bottom:145px;

    display:flex;
    flex-direction:column;
    gap:7px;
}

.control{
    width:44px;
    height:44px;

    border:1px solid rgba(255,255,255,.13);

    border-radius:13px;

    background:rgba(5,15,28,.88);

    color:white;

    font-size:19px;

    cursor:pointer;

    backdrop-filter:blur(16px);

    box-shadow:
        0 8px 25px rgba(0,0,0,.3);
}

.control:hover{
    background:rgba(255,255,255,.14);
}

/* =========================================
   GPS
========================================= */

#gps{
    position:absolute;

    z-index:950;

    right:12px;
    bottom:88px;

    width:48px;
    height:48px;

    border-radius:15px;

    border:1px solid rgba(255,255,255,.13);

    background:rgba(5,15,28,.9);

    color:white;

    font-size:21px;

    cursor:pointer;

    backdrop-filter:blur(18px);
}

/* =========================================
   LEGEND
========================================= */

.legend{
    position:absolute;

    z-index:900;

    right:65px;
    bottom:82px;

    display:none;

    min-width:145px;

    padding:10px 12px;

    border-radius:14px;

    background:rgba(5,15,28,.9);

    border:1px solid rgba(255,255,255,.12);

    backdrop-filter:blur(18px);

    font-size:10px;
}

.legend-title{
    font-weight:800;
    margin-bottom:7px;
}

.gradient{
    height:8px;
    border-radius:10px;

    background:
        linear-gradient(
            90deg,
            #4b0082,
            #008cff,
            #00d084,
            #ffe000,
            #ff6400,
            #c00000
        );
}

.legend-values{
    display:flex;
    justify-content:space-between;

    margin-top:4px;

    opacity:.6;
}

/* =========================================
   LOADING
========================================= */

#loading{
    position:fixed;

    inset:0;

    z-index:9999;

    display:grid;
    place-items:center;

    background:#07111f;

    transition:.5s;
}

#loading.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.loader{
    text-align:center;
}

.loader-logo{
    width:65px;
    height:65px;

    display:grid;
    place-items:center;

    margin:auto;

    border-radius:20px;

    background:
        linear-gradient(
            135deg,
            #ff9f1c,
            #ff5935
        );

    font-size:28px;

    animation:pulse 1.5s infinite;
}

.loader-text{
    margin-top:13px;

    font-size:11px;

    letter-spacing:1px;

    opacity:.6;
}

@keyframes pulse{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.08);
    }

}

/* =========================================
   WIND PARTICLES
========================================= */

.wind-particle{
    position:absolute;

    width:3px;
    height:3px;

    border-radius:50%;

    background:white;

    opacity:.75;

    pointer-events:none;

    z-index:500;
}

.wind-line{
    position:absolute;

    height:1px;

    width:30px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.8)
        );

    pointer-events:none;

    z-index:500;
}

/* =========================================
   MOBILE
========================================= */

@media(max-width:700px){

    .topbar{
        top:9px;
        left:9px;
        right:9px;
    }

    .brand{
        padding:7px;
    }

    .brand-text{
        display:none;
    }

    .brand-icon{
        width:32px;
        height:32px;
    }

    .layers{
        top:62px;
        left:9px;
        right:9px;
    }

    .card{
        left:9px;
        bottom:78px;

        width:
            calc(100% - 67px);

        padding:14px;
    }

    .temp{
        font-size:39px;
    }

    .controls{
        right:9px;
        bottom:142px;
    }

    #gps{
        right:9px;
        bottom:82px;
    }

    .legend{
        right:65px;
        bottom:82px;
    }

}

/* Leaflet */

.leaflet-control-attribution{
    font-size:8px;
}

</style>
</head>

<body>

<div id="app">

<div id="map"></div>

<!-- LOADING -->

<div id="loading">

    <div class="loader">

        <div class="loader-logo">
            🌤️
        </div>

        <div class="loader-text">
            SHOHIN WEATHER
        </div>

    </div>

</div>


<!-- TOP -->

<div class="topbar">

    <div class="brand">

        <div class="brand-icon">
            🌤️
        </div>

        <div class="brand-text">

            <div class="brand-title">
                SHOHIN WEATHER
            </div>

            <div class="brand-sub">
                GLOBAL WEATHER
            </div>

    </div>


    <div class="search">

    </button>

        class="layer"
        id="cloudBtn">

    </button>

</div>


<!-- WEATHER CARD -->

<div class="card">

    <div class="card-head">

        <div>

            <div
                id="location"
                class="location">
                Dushanbe
            </div>

            <div
                id="coords"
                class="coords">
                38.55980°, 68.78700°
            </div>

        </div>

        <button
            id="close"
            class="close">
            ×
        </button>

    </div>


    <div
        id="temperature"
        class="temp">
        …
    </div>


    <div
        id="description"
        class="description">
        Получаем погоду...
    </div>


    <div class="weather-grid">

        <div class="weather-item">

            <span>
                💨 Wind
            </span>

            <strong id="windValue">
                —
            </strong>

        </div>


        <div class="weather-item">

            <span>
                💧 Humidity
            </span>

            <strong id="humidity">
                —
            </strong>

        </div>


        <div class="weather-item">

            <span>

            </span>

        <span>-30°</span>
        <span>0°</span>

</div>

</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

"use strict";

/* =========================================================
   SHOHIN WEATHER V4
========================================================= */

const SW = {

    map:null,

    standard:null,

    satellite:null,

    marker:null,

    layer:null,

    mode:"map",

    gridRequest:0,

    location:{
        lat:38.5598,
        lon:68.7870,
        name:"Dushanbe"
    }

};


/* =========================================================
   HELPERS
========================================================= */

const $ = id =>
    document.getElementById(id);


/* =========================================================
   START
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    init
);


function init(){

    createMap();

    setupButtons();

    setupSearch();

    setupGPS();

    loadWeather(
        SW.location.lat,
        SW.location.lon
    );

    setTimeout(
        ()=>{
            $("loading")
                .classList
                .add("hide");
        },
        700
    );

}


/* =========================================================
   MAP
========================================================= */

function createMap(){

    SW.map =
        L.map(
            "map",
            {
                zoomControl:false,
                minZoom:2,
                maxZoom:18,
                worldCopyJump:true,
                preferCanvas:true
            }
        )
        .setView(
            [
                SW.location.lat,
                SW.location.lon
            ],
            4
        );


    SW.standard =
        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom:19,
                attribution:
                    "&copy; OpenStreetMap"
            }
        )
        .addTo(
            SW.map
        );


    SW.satellite =
        L.tileLayer(
            "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
            {
                maxZoom:19,
                attribution:
                    "Tiles © Esri"
            }
        );


    SW.layer =
        L.layerGroup()
            .addTo(
                SW.map
            );


    SW.map.on(
        "click",
        event => {

            selectPoint(
                event.latlng.lat,
                event.latlng.lng
            );

        }
    );

}


/* =========================================================
   SELECT POINT
========================================================= */

async function selectPoint(
    lat,
    lon,
    name
){

    SW.location = {

        lat,
        lon,

        name:
            name ||
            "Выбранная точка"

    };


    $("location")
        .textContent =
        SW.location.name;


    $("coords")
        .textContent =
        lat.toFixed(5) +
        "°, " +
        lon.toFixed(5) +
        "°";


    if(SW.marker){

        SW.map.removeLayer(
            SW.marker
        );

    }


    SW.marker =
        L.marker(
            [lat,lon]
        )
        .addTo(
            SW.map
        );


    SW.marker.bindPopup(
        "SHOHIN WEATHER<br>" +
        lat.toFixed(4) +
        "°, " +
        lon.toFixed(4) +
        "°"
    )
    .openPopup();


    loadWeather(
        lat,
        lon
    );


    if(
        SW.mode ===
        "temperature"
    ){

        temperatureLayer();

    }

    if(
        SW.mode ===
        "rain"
    ){

        rainLayer();

    }

    if(
        SW.mode ===
        "clouds"
    ){

        cloudLayer();

    }

}


/* =========================================================
   WEATHER
========================================================= */

async function loadWeather(
    lat,
    lon
){

    $("temperature")
        .textContent =
        "…";

    $("description")
        .textContent =
        "Получаем погоду...";


    try{

        const url =
            "https://api.open-meteo.com/v1/forecast" +

            "?latitude=" +
            lat +

            "&longitude=" +
            lon +

            "&current=" +
            "temperature_2m," +
            "relative_humidity_2m," +
            "precipitation," +
            "weather_code," +
            "cloud_cover," +
            "wind_speed_10m," +
            "wind_direction_10m," +
            "apparent_temperature," +
            "pressure_msl" +

            "&timezone=auto";


        const response =
            await fetch(
                url
            );


        if(!response.ok)
            throw new Error(
                "API error"
            );


        const data =
            await response.json();


        showWeather(
            data
        );

    }

    catch(error){

        console.error(
            error
        );

        $("description")
            .textContent =
            "Не удалось получить погоду";

    }

}


/* =========================================================
   SHOW WEATHER
========================================================= */

function showWeather(data){

    if(!data.current)
        return;


    const c =
        data.current;


    $("temperature")
        .textContent =
        Math.round(
            c.temperature_2m
        ) +
        "°C";


    $("description")
        .textContent =
        weatherText(
            c.weather_code
        );


    $("windValue")
        .textContent =
        Math.round(
            c.wind_speed_10m
        ) +
        " km/h";


    $("humidity")
        .textContent =
        Math.round(
            c.relative_humidity_2m
        ) +
        "%";


    $("clouds")
        .textContent =
        Math.round(
            c.cloud_cover
        ) +
        "%";


    $("rainValue")
        .textContent =
        Number(
            c.precipitation || 0
        ).toFixed(1) +
        " mm";


    if(SW.marker){

        SW.marker.bindPopup(
            `
            <div style="
                min-width:180px;
                text-align:center;
                padding:5px;
            ">

                <b style="font-size:22px">
                    ${Math.round(
                        c.temperature_2m
                    )}°C
                </b>

                <br>

                ${weatherText(
                    c.weather_code
                )}

                <hr>

                💨 ${Math.round(
                    c.wind_speed_10m
                )} km/h

                <br>

                💧 ${Math.round(
                    c.relative_humidity_2m
                )}%

                <br>

                ☁️ ${Math.round(
                    c.cloud_cover
                )}%

                <br>

                🌧️ ${Number(
                    c.precipitation || 0
                ).toFixed(1)} mm

            </div>
            `
        );

    }

}


/* =========================================================
   WEATHER TEXT
========================================================= */

function weatherText(code){

    const x = {

        0:"Ясно ☀️",

        1:"Преимущественно ясно 🌤️",

        2:"Переменная облачность ⛅",

        3:"Пасмурно ☁️",

        45:"Туман 🌫️",

        48:"Туман 🌫️",

        51:"Морось 🌦️",

        53:"Морось 🌦️",

        55:"Сильная морось 🌧️",

        61:"Небольшой дождь 🌦️",

        63:"Дождь 🌧️",

        65:"Сильный дождь 🌧️",

        71:"Снег 🌨️",

        73:"Снег ❄️",

        75:"Сильный снег ❄️",

        80:"Ливень 🌦️",

        81:"Сильный ливень 🌧️",

        82:"Очень сильный ливень ⛈️",

        95:"Гроза ⛈️",

        96:"Гроза с градом ⛈️",

        99:"Сильная гроза ⛈️"

    };

    return x[code] ||
        "Погода";

}


/* =========================================================
   BUTTONS
========================================================= */

function setupButtons(){

    $("plus")
        .onclick =
        () =>
            SW.map.zoomIn();


    $("minus")
        .onclick =
        () =>
            SW.map.zoomOut();


    $("world")
        .onclick =
        () => {

            SW.map.flyTo(
                [20,0],
                2,
                {
                    duration:1
                }
            );

        };


    $("close")
        .onclick =
        () => {

            if(SW.marker){

                SW.map.removeLayer(
                    SW.marker
                );

                SW.marker=null;

            }

        };


    $("mapBtn")
        .onclick =
        () =>
            mapLayer();


    $("satBtn")
        .onclick =
        () =>
            satelliteLayer();


    $("tempBtn")
        .onclick =
        () =>
            temperatureLayer();


    $("rainBtn")
        .onclick =
        () =>
            rainLayer();


    $("windBtn")
        .onclick =
        () =>
            windLayer();


    $("cloudBtn")

/* =========================================================
   TEMPERATURE GRID
========================================================= */

async function drawTemperature(){

    SW.layer.clearLayers();


    const bounds =
        SW.map.getBounds();


    const zoom =
        SW.map.getZoom();


    let step =
        8;


    if(zoom>=4)
        step=4;

    if(zoom>=6)
        step=2;


    const points=[];


    let south =
        Math.max(
            -60,
            bounds.getSouth()
        );


    let north =
        Math.min(
            85,
            bounds.getNorth()
        );


    let west =
        bounds.getWest();


    let east =
        bounds.getEast();


    for(
        let lat=south;
        lat<=north;
        lat+=step
    ){

        for(
            let lon=west;
            lon<=east;
            lon+=step
        ){

            points.push([
                lat,
                lon
            ]);

            if(
                points.length>=180
            )
                break;

        }

        if(
            points.length>=180
        )
            break;

    }


    if(!points.length)
        return;


    const lats =
        points
            .map(
                p=>p[0]
            )
            .join(",");


    const lons =
        points
            .map(
                p=>p[1]
            )
            .join(",");


    const url =
        "https://api.open-meteo.com/v1/forecast" +

        "?latitude=" +
        lats +

        "&longitude=" +
        lons +

        "&current=temperature_2m" +

        "&timezone=auto";


    try{

        const response =
            await fetch(
                url
            );


        const data =
            await response.json();


        const list =
            Array.isArray(data)
                ? data
                : [data];


        list.forEach(
            (item,i)=>{

                if(
                    !item.current
                )
                    return;


                const temp =
                    Number(
                        item.current
                            .temperature_2m
                    );


                L.circle(
                    points[i],
                    {

                        radius:
                            gridRadius(),

                        stroke:false,

                        fillColor:
                            tempColor(
                                temp
                            ),

                        fillOpacity:.43,

                        interactive:false

                    }
                )
                .addTo(
                    SW.layer
                );


                if(
                    zoom>=4
                ){

                    L.marker(
                        points[i],
                        {

                            interactive:false,

                            icon:
                                L.divIcon({

                                    className:"",

                                    html:
                                        `
                                        <div style="
                                            color:white;
                                            font-size:11px;
                                            font-weight:800;
                                            text-shadow:
                                                0 1px 4px #000;
                                        ">
                                            ${Math.round(
                                                temp
                                            )}°
                                        </div>
                                        `,

                                    iconSize:
                                        [30,20],

                                    iconAnchor:
                                        [15,10]

                                })

                        }
                    )
                    .addTo(
                        SW.layer
                    );

                }

            }
        );

    }

    catch(error){

        console.error(
            "TEMP:",
            error
        );

    }

}


/* =========================================================
   TEMP COLOR
========================================================= */

function tempColor(t){

    if(t<=-30)
        return "#4b0082";

    if(t<=-20)
        return "#0000ff";

    if(t<=-10)
        return "#008cff";

    if(t<=0)
        return "#00c8ff";

    if(t<=10)
        return "#00d084";

    if(t<=20)
        return "#a8d400";

    if(t<=25)
        return "#ffe000";

    if(t<=30)
        return "#ffae00";

    if(t<=35)
        return "#ff6400";

    if(t<=40)
        return "#ff2200";

    return "#c00000";

}


/* =========================================================
   RADIUS
========================================================= */

function gridRadius(){

    const z =
        SW.map.getZoom();

    if(z<=2)
        return 700000;

    if(z<=3)
        return 450000;

    if(z<=4)
        return 280000;

    if(z<=5)
        return 170000;

    return 90000;

}

/* =========================================================
   RAIN DATA
========================================================= */

async function loadRain(
    points
){

    if(!points.length)
        return;


    const lats =
        points
            .map(
                p=>p[0]
            )
            .join(",");


    const lons =
        points
            .map(
                p=>p[1]
            )
            .join(",");


    const url =
        "https://api.open-meteo.com/v1/forecast" +

        "?latitude=" +
        lats +

        "&longitude=" +
        lons +

        "&current=precipitation" +

        "&timezone=auto";


    try{

        const response =
            await fetch(
                url
            );


        const data =
            await response.json();


        const list =
            Array.isArray(data)
                ? data
                : [data];


        list.forEach(
            (item,i)=>{

                if(
                    !item.current
                )
                    return;


                const rain =
                    Number(
                        item.current
                            .precipitation || 0
                    );


                if(
                    rain<=0
                )
                    return;


                L.circle(
                    points[i],
                    {

                        radius:
                            gridRadius(),

                        stroke:false,

                        fillColor:
                            rainColor(
                                rain
                            ),

                        fillOpacity:
                            .55,

                        interactive:false

                    }
                )
                .addTo(
                    SW.layer
                );


                if(
                    SW.map.getZoom()>=4
                ){

                    L.marker(
                        points[i],
                        {

                            interactive:false,

                            icon:
                                L.divIcon({

                                    className:"",

                                    html:
                                        `
                                        <div style="
                                            color:white;
                                            font-size:10px;
                                            font-weight:800;
                                            text-shadow:
                                                0 1px 4px #000;
                                        ">
                                            ${rain.toFixed(1)}
                                        </div>
                                        `,

                                    iconSize:
                                        [30,18],

                                    iconAnchor:
                                        [15,9]

                                })

                        }
                    )
                    .addTo(
                        SW.layer
                    );

                }

            }
        );

    }

    catch(error){

        console.error(
            "RAIN:",
            error
        );

    }

}


/* =========================================================
   POINTS
========================================================= */

function makePoints(bounds){

    const zoom =
        SW.map.getZoom();


    let step=8;

    if(zoom>=4)
        step=4;

    if(zoom>=6)
        step=2;


    const points=[];


    const south =
        Math.max(
            -60,
            bounds.getSouth()
        );


    const north =
        Math.min(
            85,
            bounds.getNorth()
        );


    const west =
        bounds.getWest();


    const east =
        bounds.getEast();


    for(
        let lat=south;
        lat<=north;
        lat+=step
    ){

        for(
            let lon=west;
            lon<=east;
            lon+=step
        ){

            points.push([
                lat,
                lon
            ]);


            if(
                points.length>=160
            )
                return points;

        }

    }


    return points;

}


/* =========================================================
   RAIN COLOR
========================================================= */

function rainColor(r){

    if(r<.2)
        return "#75d7ff";

    if(r<1)
        return "#2196f3";

    if(r<3)
        return "#3949ab";

    if(r<7)
        return "#7e57c2";

    if(r<15)
        return "#d81b60";

    if(r<30)
        return "#f4511e";

    return "#b71c1c";

}

/* =========================================================
   SEARCH
========================================================= */

function setupSearch(){

    const input =
        $("searchInput");


    let timer;


    input.addEventListener(
        "input",
        ()=>{

            clearTimeout(
                timer
            );


            const q =
                input.value.trim();


            if(q.length<2){

                $("results")
                    .style
                    .display =
                    "none";

                return;

            }


            timer =
                setTimeout(
                    ()=>search(q),
                    350
                );

        }
    );

}


/* =========================================================
   SEARCH API
========================================================= */

async function search(q){

    try{

        const url =
            "https://geocoding-api.open-meteo.com/v1/search" +

            "?name=" +
            encodeURIComponent(q) +

            "&count=8" +

            "&language=ru" +

            "&format=json";


        const response =
            await fetch(
                url
            );


        const data =
            await response.json();


        showResults(
            data.results || []
        );

    }

    catch(error){

        console.error(
            "SEARCH:",
            error
        );

    }

}


/* =========================================================
   RESULTS
========================================================= */

function showResults(
    results
){

    const box =
        $("results");


    if(!results.length){

        box.style.display =
            "none";

        return;

    }


    box.innerHTML =
        results
        .map(
            place =>
            `
            <div
                class="result"
                data-lat="${place.latitude}"
                data-lon="${place.longitude}"
                data-name="${escapeHTML(
                    place.name
                )}"
            >

                <strong>
                    ${escapeHTML(
                        place.name
                    )}
                </strong>

                <small>
                    ${escapeHTML(
                        place.admin1 || ""
                    )}
                    ${
                        place.country
                        ?
                        " • " +
                        escapeHTML(
                            place.country
                        )
                        :
                        ""
                    }
                </small>

            </div>
            `
        )
        .join("");


    box.style.display =
        "block";


    box
        .querySelectorAll(
            ".result"
        )
        .forEach(
            item => {

                item.onclick =
                    async ()=>{

                        const lat =
                            Number(
                                item.dataset.lat
                            );


                        const lon =
                            Number(
                                item.dataset.lon
                            );


                        const name =
                            item.dataset.name;


                        $("searchInput")
                            .value =
                            "";


                        box.style.display =
                            "none";


                        SW.map.flyTo(
                            [
                                lat,
                                lon
                            ],
                            8,
                            {
                                duration:1
                            }
                        );


                        await selectPoint(
                            lat,
                            lon,
                            name
                        );

                    };

            }
        );

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(
    text
){

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   GPS
========================================================= */

function setupGPS(){

    $("gps")
        .onclick =
        ()=>{

            if(
                !navigator.geolocation
            ){

                alert(
                    "GPS не поддерживается."
                );

                return;

            }


            $("gps")
                .textContent =
                "⌛";


            navigator.geolocation
                .getCurrentPosition(

                    async position => {

                        const lat =
                            position.coords
                                .latitude;


                        const lon =
                            position.coords
                                .longitude;


                        SW.map.flyTo(
                            [
                                lat,
                                lon
                            ],
                            10,
                            {
                                duration:1.2
                            }
                        );


                        await selectPoint(
                            lat,
                            lon,
                            "Моё местоположение"
                        );


                        $("gps")
                            .textContent =
                            "📍";

                    },


                    error => {

                        console.error(
                            error
                        );


                        $("gps")
                            .textContent =
                            "📍";


                        alert(
                            "Разрешите доступ к местоположению."
                        );

                    },

                    {

                        enableHighAccuracy:true,

                        timeout:20000,

                        maximumAge:0

                    }

                );

        };

}


/* =========================================================
   MAP MOVEMENT
========================================================= */

SW_MAP_MOVEMENT_SETUP = true;


/*
 * После перемещения карты
 * автоматически обновляем
 * выбранный погодный слой.
 */

setTimeout(
    ()=>{

        if(!SW.map)
            return;


        SW.map.on(
            "moveend",
            ()=>{

                if(
                    SW.mode ===
                    "temperature"
                )
                    drawTemperature();


                if(
                    SW.mode ===
                    "rain"
                )
                    rainLayer();


                if(
                    SW.mode ===
                    "clouds"
                )
                    cloudLayer();


                if(
                    SW.mode ===
                    "wind"
                )
                    windLayer();

            }
        );

    },
    1000
);
