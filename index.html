<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>SHOHIN Weather V5</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #07111f;

}

#app {

    position: relative;

    width: 100%;
    height: 100%;

}

#map {

    position: absolute;

    inset: 0;

    background: #091827;

}


/* =========================================
   TOP
========================================= */

#topbar {

    position: absolute;

    top: 15px;
    left: 15px;
    right: 15px;

    height: 58px;

    z-index: 2000;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 18px;

    border-radius: 17px;

    background:
        rgba(5,15,28,.90);

    border:
        1px solid
        rgba(255,255,255,.12);

    backdrop-filter:
        blur(15px);

    color: white;

}

.logo {

    font-size: 21px;

    font-weight: 800;

}

.logo span {

    color: #38bdf8;

}

#online {

    font-size: 12px;

    color: #facc15;

}


/* =========================================
   WEATHER PANEL
========================================= */

#weatherPanel {

    position: absolute;

    z-index: 2000;

    top: 88px;
    left: 15px;

    width: 315px;

    padding: 18px;

    border-radius: 20px;

    background:
        rgba(5,15,28,.90);

    border:
        1px solid
        rgba(255,255,255,.12);

    backdrop-filter:
        blur(18px);

    color: white;

}

#location {

    font-size: 19px;

    font-weight: 700;

}

#coordinates {

    margin-top: 4px;

    color: #8fa8bd;

    font-size: 12px;

}

#temperature {

    margin-top: 12px;

    font-size: 56px;

    line-height: 1;

    font-weight: 300;

}

#weatherStatus {

    margin-top: 8px;

    color: #9eb3c6;

    font-size: 13px;

}


/* =========================================
   METRICS
========================================= */

#metrics {

    margin-top: 18px;

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 8px;

}

.metric {

    padding: 11px;

    border-radius: 12px;

    background:
        rgba(255,255,255,.06);

}

.metric-title {

    font-size: 11px;

    color: #8fa8bd;

}

.metric-value {

    margin-top: 5px;

    font-size: 15px;

    font-weight: 600;

}


/* =========================================
   LAYERS
========================================= */

#layers {

    position: absolute;

    z-index: 2000;

    top: 88px;
    right: 15px;

    width: 165px;

    padding: 10px;

    border-radius: 17px;

    background:
        rgba(5,15,28,.90);

    border:
        1px solid
        rgba(255,255,255,.12);

    backdrop-filter:
        blur(15px);

}

.layerTitle {

    color: #8fa8bd;

    font-size: 11px;

    padding:
        5px 8px 8px;

}

.layerButton {

    width: 100%;

    margin: 3px 0;

    padding: 10px;

    border: none;

    border-radius: 10px;

    color: white;

    background:
        rgba(255,255,255,.06);

    cursor: pointer;

    text-align: left;

}

.layerButton:hover {

    background:
        rgba(56,189,248,.18);

}

.layerButton.active {

    background:
        rgba(56,189,248,.30);

}


/* =========================================
   LOADING
========================================= */

#loading {

    position: absolute;

    inset: 0;

    z-index: 5000;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    background: #07111f;

    color: white;

    transition:
        opacity .35s ease;

}

#loading.hidden {

    opacity: 0;

    pointer-events: none;

}

.loader {

    width: 45px;
    height: 45px;

    border-radius: 50%;

    border:
        4px solid
        rgba(255,255,255,.12);

    border-top-color:
        #38bdf8;

    animation:
        spin .8s linear infinite;

    margin-bottom: 15px;

}

@keyframes spin {

    to {

        transform:
            rotate(360deg);

    }

}


/* =========================================
   ERROR
========================================= */

#error {

    display: none;

    position: absolute;

    z-index: 6000;

    left: 15px;
    right: 15px;

    bottom: 15px;

    max-height: 45%;

    overflow: auto;

    padding: 15px;

    border-radius: 14px;

    background:
        rgba(127,29,29,.96);

    color: white;

    white-space: pre-wrap;

    font-size: 13px;

}

#error.show {

    display: block;

}


/* =========================================
   MOBILE
========================================= */

@media (
    max-width: 650px
) {

    #topbar {

        top: 8px;
        left: 8px;
        right: 8px;

    }

    #weatherPanel {

        top: 75px;
        left: 8px;

        width: 275px;

        padding: 15px;

    }

    #layers {

        top: 75px;
        right: 8px;

        width: 140px;

    }

    #temperature {

        font-size: 48px;

    }

    .layerButton {

        font-size: 12px;

        padding: 8px;

    }

}

</style>

</head>


<body>


<div id="app">


    <div id="map"></div>


    <div id="topbar">

        <div class="logo">

            🌍 SHOHIN
            <span>WEATHER</span>

        </div>

        <div id="online">

            ● STARTING

        </div>

    </div>


    <div id="weatherPanel">


        <div id="location">

            Dushanbe

        </div>


        <div id="coordinates">

            38.5598° N,
            68.7870° E

        </div>


        <div id="temperature">

            --°C

        </div>


        <div id="weatherStatus">

            Подключение...

        </div>


        <div id="metrics">


            <div class="metric">

                <div class="metric-title">
                    💧 Влажность
                </div>

                <div
                    id="humidity"
                    class="metric-value"
                >
                    --
                </div>

            </div>


            <div class="metric">

                <div class="metric-title">
                    🌧 Осадки
                </div>

                <div
                    id="rain"
                    class="metric-value"
                >
                    --
                </div>

            </div>


            <div class="metric">

                <div class="metric-title">
                    💨 Ветер
                </div>

                <div
                    id="wind"
                    class="metric-value"
                >
                    --
                </div>

            </div>


            <div class="metric">

                <div class="metric-title">
                    ☁ Облака
                </div>

                <div
                    id="clouds"
                    class="metric-value"
                >
                    --
                </div>

            </div>


            <div class="metric">

                <div class="metric-title">
                    🌀 Давление
                </div>

                <div
                    id="pressure"
                    class="metric-value"
                >
                    --
                </div>

            </div>


        </div>

    </div>


    <div id="layers">


        <div class="layerTitle">

            WEATHER LAYERS

        </div>


        <button
            class="layerButton active"
            id="temperatureLayer"
        >

            🌡 Temperature

        </button>


        <button
            class="layerButton"
            id="rainLayer"
        >

            🌧 Rain

        </button>


        <button
            class="layerButton"
            id="windLayer"
        >

            💨 Wind

        </button>


        <button
            class="layerButton"
            id="cloudLayer"
        >

            ☁ Clouds

        </button>


        <button
            class="layerButton"
            id="pressureLayer"
        >

            🌀 Pressure

        </button>


    </div>


    <div id="loading">

        <div class="loader"></div>

        <div>

            🌍 SHOHIN Weather V5

        </div>

        <div
            id="loadingText"
            style="
                margin-top:7px;
                color:#8fa8bd;
                font-size:13px;
            "
        >

            Запуск...

        </div>

    </div>


    <div id="error"></div>


</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script type="module">


/*
====================================================
 SHOHIN WEATHER V5
 SAFE BOOT
====================================================
*/


const $ =
    id =>
        document.getElementById(id);


const loading =
    $("loading");


const loadingText =
    $("loadingText");


const errorBox =
    $("error");


const online =
    $("online");


const status =
    $("weatherStatus");


/*
====================================================
 MODULES
====================================================
*/


let WeatherEngine;
let MapEngine;
let WeatherLayers;
let RainLayer;
let WeatherGrid;
let WeatherRenderer;


/*
====================================================
 STATE
====================================================
*/


let weatherEngine = null;

let mapEngine = null;

let weatherLayers = null;

let rainLayer = null;

let weatherGrid = null;

let weatherRenderer = null;

let weatherData = null;


/*
====================================================
 TIMEOUT
====================================================
*/


function timeout(
    promise,
    ms,
    message
) {

    return Promise.race([

        promise,

        new Promise(
            (_, reject) => {

                setTimeout(
                    () => {

                        reject(
                            new Error(
                                message
                            )
                        );

                    },
                    ms
                );

            }
        )

    ]);

}


/*
====================================================
 SAFE MODULE IMPORT
====================================================
*/


async function loadModules() {


    loadingText.textContent =
        "Загрузка модулей...";


    const modules =
        await Promise.all([

            import(
                "./js/WeatherEngine.js"
            ),

            import(
                "./js/MapEngine.js"
            ),

            import(
                "./js/WeatherLayers.js"
            ),

            import(
                "./js/RainLayer.js"
            ),

            import(
                "./js/WeatherGrid.js"
            ),

            import(
                "./js/WeatherRenderer.js"
            )

        ]);


    WeatherEngine =
        modules[0].WeatherEngine;


    MapEngine =
        modules[1].MapEngine;


    WeatherLayers =
        modules[2].WeatherLayers;


    RainLayer =
        modules[3].RainLayer;


    WeatherGrid =
        modules[4].WeatherGrid;


    WeatherRenderer =
        modules[5].WeatherRenderer;

}


/*
====================================================
 START
====================================================
*/


async function start() {


    try {


        /*
        ============================================
        STEP 1
        ============================================
        */


        online.textContent =
            "● MODULES";


        await timeout(

            loadModules(),

            10000,

            "Модули не загрузились за 10 секунд"

        );


        /*
        ============================================
        STEP 2
        ============================================
        */


        loadingText.textContent =
            "Подключение к Weather API...";


        online.textContent =
            "● API";


        weatherEngine =
            new WeatherEngine();


        /*
        ============================================
        API TIMEOUT
        ============================================
        */


        weatherData =
            await timeout(

                weatherEngine.load(),

                10000,

                "Weather API не ответил за 10 секунд"

            );


        /*
        ============================================
        STEP 3
        ============================================
        */


        loadingText.textContent =
            "Создание карты...";


        online.textContent =
            "● MAP";


        mapEngine =
            new MapEngine({

                container:
                    "map",

                latitude:
                    weatherEngine
                        .location
                        .latitude,

                longitude:
                    weatherEngine
                        .location
                        .longitude,

                zoom:
                    6

            });


        await timeout(

            mapEngine.init(),

            10000,

            "Карта не инициализировалась"

        );


        /*
        ============================================
        STEP 4
        ============================================
        */


        loadingText.textContent =
            "Подключение Weather Layers...";


        weatherLayers =
            new WeatherLayers(

                mapEngine,

                weatherData

            );


        /*
        ============================================
        STEP 5
        ============================================
        */


        loadingText.textContent =
            "Подключение Rain Layer...";


        rainLayer =
            new RainLayer(

                mapEngine,

                weatherData

            );


        /*
        ============================================
        STEP 6
        ============================================
        */


        loadingText.textContent =
            "Создание Weather Grid...";


        weatherGrid =
            new WeatherGrid({

                latitude:
                    weatherEngine
                        .location
                        .latitude,

                longitude:
                    weatherEngine
                        .location
                        .longitude,

                size:
                    15,

                step:
                    0.20

            });


        const grid =
            weatherGrid.build();


        /*
        ============================================
        REAL CURRENT TEMPERATURE
        ============================================
        */


        const temperature =
            Number(
                weatherData
                    ?.hourly
                    ?.temperature_2m
                    ?.at(0)
            );


        const safeTemperature =
            Number.isFinite(
                temperature
            )
            ? temperature
            : 20;


        /*
        ============================================
        GRID VALUES
        ============================================
        */


        const values =
            grid.map(
                point => {


                    const distance =
                        Math.sqrt(

                            Math.pow(

                                point.latitude -
                                weatherEngine
                                    .location
                                    .latitude,

                                2

                            )

                            +

                            Math.pow(

                                point.longitude -
                                weatherEngine
                                    .location
                                    .longitude,

                                2

                            )

                        );


                    return (

                        safeTemperature
                        -
                        distance * 2

                    );

                }
            );


        weatherGrid.applyValues(
            values
        );


        /*
        ============================================
        STEP 7
        ============================================
        */


        loadingText.textContent =
            "Запуск Weather Renderer...";


        weatherRenderer =
            new WeatherRenderer(

                mapEngine,

                {

                    opacity:
                        0.58,

                    radius:
                        42

                }

            );


        weatherRenderer.setGrid(
            weatherGrid.getGrid()
        );


        /*
        ============================================
        UI
        ============================================
        */


        updateWeather();


        /*
        ============================================
        READY
        ============================================
        */


        setActive(
            "temperatureLayer"
        );


        status.textContent =
            "🌡 Temperature Grid";


        online.textContent =
            "● SHOHIN ONLINE";


        online.style.color =
            "#4ade80";


        loading.classList.add(
            "hidden"
        );


        console.log(
            "SHOHIN WEATHER V5 READY"
        );


    }
    catch (
        error
    ) {


        console.error(
            "SHOHIN V5 ERROR:",
            error
        );


        online.textContent =
            "● ERROR";


        online.style.color =
            "#fb7185";


        loading.classList.add(
            "hidden"
        );


        showError(
            error
        );

    }

}


/*
====================================================
 WEATHER UI
====================================================
*/


function updateWeather() {


    const hourly =
        weatherData?.hourly;


    if (
        !hourly
    ) {

        return;

    }


    const i = 0;


    if (
        hourly.temperature_2m
    ) {

        $("temperature")
            .textContent =

            Math.round(
                hourly
                    .temperature_2m[i]
            ) +

            "°C";

    }


    if (
        hourly.relative_humidity_2m
    ) {

        $("humidity")
            .textContent =

            Math.round(
                hourly
                    .relative_humidity_2m[i]
            ) +

            "%";

    }


    if (
        hourly.precipitation
    ) {

        $("rain")
            .textContent =

            Number(
                hourly
                    .precipitation[i]
            ).toFixed(1) +

            " mm";

    }


    if (
        hourly.wind_speed_10m
    ) {

        $("wind")
            .textContent =

            Number(
                hourly
                    .wind_speed_10m[i]
            ).toFixed(1) +

            " km/h";

    }


    if (
        hourly.cloud_cover
    ) {

        $("clouds")
            .textContent =

            Math.round(
                hourly
                    .cloud_cover[i]
            ) +

            "%";

    }


    if (
        hourly.pressure_msl
    ) {

        $("pressure")
            .textContent =

            Math.round(
                hourly
                    .pressure_msl[i]
            ) +

            " hPa";

    }

}


/*
====================================================
 TEMPERATURE
====================================================
*/


$("temperatureLayer")
.addEventListener(
    "click",
    () => {


        if (
            weatherRenderer
        ) {

            weatherRenderer.show();

        }


        if (
            rainLayer
        ) {

            rainLayer.hide();

        }


        setActive(
            "temperatureLayer"
        );


        status.textContent =
            "🌡 Temperature Grid";

    }
);


/*
====================================================
 RAIN
====================================================
*/


$("rainLayer")
.addEventListener(
    "click",
    () => {


        if (
            weatherRenderer
        ) {

            weatherRenderer.hide();

        }


        if (
            rainLayer
        ) {

            rainLayer.show();

        }


        setActive(
            "rainLayer"
        );


        const value =
            rainLayer
                ?.getCurrentValue();


        status.textContent =

            "🌧 Rain: " +

            Number(
                value || 0
            ).toFixed(1) +

            " mm";

    }
);


/*
====================================================
 WIND
====================================================
*/


$("windLayer")
.addEventListener(
    "click",
    () => {


        if (
            weatherRenderer
        ) {

            weatherRenderer.hide();

        }


        if (
            rainLayer
        ) {

            rainLayer.hide();

        }


        setActive(
            "windLayer"
        );


        status.textContent =
            "💨 Wind — скоро";

    }
);


/*
====================================================
 CLOUDS
====================================================
*/


$("cloudLayer")
.addEventListener(
    "click",
    () => {


        if (
            weatherRenderer
        ) {

            weatherRenderer.hide();

        }


        if (
            rainLayer
        ) {

            rainLayer.hide();

        }


        setActive(
            "cloudLayer"
        );


        status.textContent =
            "☁ Clouds — скоро";

    }
);


/*
====================================================
 PRESSURE
====================================================
*/


$("pressureLayer")
.addEventListener(
    "click",
    () => {


        if (
            weatherRenderer
        ) {

            weatherRenderer.hide();

        }


        if (
            rainLayer
        ) {

            rainLayer.hide();

        }


        setActive(
            "pressureLayer"
        );


        status.textContent =
            "🌀 Pressure — скоро";

    }
);


/*
====================================================
 ACTIVE
====================================================
*/


function setActive(
    id
) {


    document
        .querySelectorAll(
            ".layerButton"
        )
        .forEach(
            button => {

                button.classList
                    .remove(
                        "active"
                    );

            }
        );


    $(id)
        .classList
        .add(
            "active"
        );

}


/*
====================================================
 ERROR
====================================================
*/


function showError(
    error
) {


    const message =

        error?.stack ||

        error?.message ||

        String(
            error
        );


    errorBox.textContent =

        "❌ SHOHIN WEATHER V5\n\n" +

        message;


    errorBox.classList.add(
        "show"
    );

}


/*
====================================================
 RUN
====================================================
*/


start();


</script>

</body>

</html>
