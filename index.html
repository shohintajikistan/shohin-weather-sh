<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #07111f;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}

#app {

    position: relative;

    width: 100%;
    height: 100%;

}

#map {

    position: absolute;

    inset: 0;

    background: #091827;

}


/* =================================================
   TOP BAR
================================================= */

#topbar {

    position: absolute;

    top: 14px;
    left: 14px;
    right: 14px;

    height: 56px;

    z-index: 3000;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 17px;

    border-radius: 17px;

    background:
        rgba(5,15,28,.90);

    border:
        1px solid
        rgba(255,255,255,.12);

    backdrop-filter:
        blur(16px);

    color: white;

}

.logo {

    font-size: 20px;

    font-weight: 800;

}

.logo span {

    color: #38bdf8;

}

#online {

    font-size: 12px;

    color: #facc15;

}


/* =================================================
   WEATHER PANEL
================================================= */

#weatherPanel {

    position: absolute;

    z-index: 3000;

    top: 84px;
    left: 14px;

    width: 310px;

    padding: 17px;

    border-radius: 20px;

    background:
        rgba(5,15,28,.90);

    border:
        1px solid
        rgba(255,255,255,.12);

    backdrop-filter:
        blur(18px);

    color: white;

}

#location {

    font-size: 19px;

    font-weight: 700;

}

#coordinates {

    margin-top: 4px;

    color: #8fa8bd;

    font-size: 12px;

}

#temperature {

    margin-top: 14px;

    font-size: 56px;

    line-height: 1;

    font-weight: 300;

}

#weatherStatus {

    margin-top: 8px;

    color: #9eb3c6;

    font-size: 13px;

}


/* =================================================
   METRICS
================================================= */

#metrics {

    margin-top: 17px;

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 7px;

}

.metric {

    padding: 10px;

    border-radius: 11px;

    background:
        rgba(255,255,255,.06);

}

.metric-title {

    font-size: 10px;

    color: #8fa8bd;

}

.metric-value {

    margin-top: 4px;

    font-size: 14px;

    font-weight: 600;

}


/* =================================================
   LAYERS
================================================= */

#layers {

    position: absolute;

    z-index: 3000;

    top: 84px;
    right: 14px;

    width: 165px;

    padding: 9px;

    border-radius: 16px;

    background:
        rgba(5,15,28,.90);

    border:
        1px solid
        rgba(255,255,255,.12);

    backdrop-filter:
        blur(16px);

}

.layerTitle {

    padding:
        5px 7px 7px;

    color: #8fa8bd;

    font-size: 10px;

}

.layerButton {

    width: 100%;

    margin: 3px 0;

    padding: 9px;

    border: 0;

    border-radius: 9px;

    color: white;

    background:
        rgba(255,255,255,.06);

    cursor: pointer;

    text-align: left;

    font-size: 12px;

}

.layerButton:hover {

    background:
        rgba(56,189,248,.18);

}

.layerButton.active {

    background:
        rgba(56,189,248,.30);

}


/* =================================================
   INFO
================================================= */

#gridInfo {

    position: absolute;

    z-index: 3000;

    right: 14px;
    bottom: 14px;

    padding:
        9px 12px;

    border-radius: 11px;

    background:
        rgba(5,15,28,.90);

    border:
        1px solid
        rgba(255,255,255,.10);

    color: #a8bdcf;

    font-size: 11px;

}

#systemStatus {

    position: absolute;

    z-index: 3000;

    left: 14px;
    bottom: 14px;

    padding:
        9px 12px;

    border-radius: 11px;

    background:
        rgba(5,15,28,.90);

    border:
        1px solid
        rgba(255,255,255,.10);

    color: #a8bdcf;

    font-size: 11px;

}


/* =================================================
   LOADING
================================================= */

#loading {

    position: absolute;

    inset: 0;

    z-index: 7000;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    background: #07111f;

    color: white;

}

#loading.hidden {

    display: none;

}

.loader {

    width: 44px;
    height: 44px;

    border-radius: 50%;

    border:
        4px solid
        rgba(255,255,255,.12);

    border-top-color:
        #38bdf8;

    animation:
        spin .8s linear infinite;

    margin-bottom: 14px;

}

@keyframes spin {

    to {

        transform:
            rotate(360deg);

    }

}


/* =================================================
   ERROR
================================================= */

#error {

    display: none;

    position: absolute;

    z-index: 8000;

    left: 14px;
    right: 14px;

    bottom: 14px;

    max-height: 50%;

    overflow: auto;

    padding: 14px;

    border-radius: 13px;

    background:
        rgba(127,29,29,.97);

    color: white;

    white-space: pre-wrap;

    font-size: 12px;

}

#error.show {

    display: block;

}


/* =================================================
   MOBILE
================================================= */

@media (
    max-width: 650px
) {

    #topbar {

        top: 7px;
        left: 7px;
        right: 7px;

    }

    #weatherPanel {

        top: 72px;
        left: 7px;

        width: 270px;

        padding: 14px;

    }

    #layers {

        top: 72px;
        right: 7px;

        width: 145px;

    }

    #temperature {

        font-size: 48px;

    }

    #systemStatus {

        left: 7px;
        bottom: 7px;

    }

    #gridInfo {

        right: 7px;
        bottom: 7px;

    }

}

</style>

<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script type="module">


/*
====================================================
 SHOHIN WEATHER V5.4
 TEMPERATURE + RAIN
====================================================
*/


const $ =
    id =>
        document.getElementById(id);


const loading =
    $("loading");

const loadingText =
    $("loadingText");

const errorBox =
    $("error");

const online =
    $("online");

const systemStatus =
    $("systemStatus");

const gridInfo =
    $("gridInfo");

const status =
    $("weatherStatus");


/*
====================================================
 MODULES
====================================================
*/


let WeatherEngine;

let MapEngine;

let WeatherGrid;

let RainLayer;


/*
====================================================
 STATE
====================================================
*/


let weatherEngine = null;

let mapEngine = null;

let weatherGrid = null;

let rainLayer = null;

let weatherData = null;

let temperatureLayer = null;

let gridVisible = true;


/*
====================================================
 TIMEOUT
====================================================
*/


function timeout(
    promise,
    ms,
    message
) {

    return Promise.race([

        promise,

        new Promise(
            (_, reject) => {

                setTimeout(
                    () => {

                        reject(
                            new Error(
                                message
                            )
                        );

                    },
                    ms
                );

            }
        )

    ]);

}


/*
====================================================
 LOAD MODULES
====================================================
*/


async function loadModules() {


    loadingText.textContent =
        "Загрузка WeatherEngine...";


    const weatherModule =
        await timeout(

            import(
                "./js/WeatherEngine.js"
            ),

            10000,

            "WeatherEngine.js не загрузился"

        );


    WeatherEngine =
        weatherModule.WeatherEngine;


    if (
        typeof WeatherEngine !==
        "function"
    ) {

        throw new Error(
            "WeatherEngine не найден"
        );

    }


    loadingText.textContent =
        "Загрузка MapEngine...";


    const mapModule =
        await timeout(

            import(
                "./js/MapEngine.js"
            ),

            10000,

            "MapEngine.js не загрузился"

        );


    MapEngine =
        mapModule.MapEngine;


    if (
        typeof MapEngine !==
        "function"
    ) {

        throw new Error(
            "MapEngine не найден"
        );

    }


    loadingText.textContent =
        "Загрузка WeatherGrid...";


    const gridModule =
        await timeout(

            import(
                "./js/WeatherGrid.js"
            ),

            10000,

            "WeatherGrid.js не загрузился"

        );


    WeatherGrid =
        gridModule.WeatherGrid;


    if (
        typeof WeatherGrid !==
        "function"
    ) {

        throw new Error(
            "WeatherGrid не найден"
        );

    }


    loadingText.textContent =
        "Загрузка RainLayer...";


    const rainModule =
        await timeout(

            import(
                "./js/RainLayer.js"
            ),

            10000,

            "RainLayer.js не загрузился"

        );


    RainLayer =
        rainModule.RainLayer;


    if (
        typeof RainLayer !==
        "function"
    ) {

        throw new Error(
            "RainLayer не найден"
        );

    }

}


/*
====================================================
 WEATHER
====================================================
*/


async function startWeather() {


    loadingText.textContent =
        "Подключение к погодному API...";


    online.textContent =
        "● API";


    weatherEngine =
        new WeatherEngine();


    weatherData =
        await timeout(

            weatherEngine.load(),

            10000,

            "Weather API не ответил за 10 секунд"

        );


    if (
        !weatherData
    ) {

        throw new Error(
            "WeatherEngine вернул пустые данные"
        );

    }

}


/*
====================================================
 MAP
====================================================
*/


async function startMap() {


    loadingText.textContent =
        "Создание карты...";


    online.textContent =
        "● MAP";


    const latitude =
        Number(
            weatherEngine
                ?.location
                ?.latitude
        );


    const longitude =
        Number(
            weatherEngine
                ?.location
                ?.longitude
        );


    const safeLat =
        Number.isFinite(
            latitude
        )
        ? latitude
        : 38.5598;


    const safeLon =
        Number.isFinite(
            longitude
        )
        ? longitude
        : 68.7870;


    mapEngine =
        new MapEngine({

            container:
                "map",

            latitude:
                safeLat,

            longitude:
                safeLon,

            zoom:
                7

        });


    await timeout(

        mapEngine.init(),

        10000,

        "MapEngine не запустился"

    );

}


/*
====================================================
 GRID
====================================================
*/


function createGrid() {


    const latitude =
        Number(
            weatherEngine
                ?.location
                ?.latitude
        );


    const longitude =
        Number(
            weatherEngine
                ?.location
                ?.longitude
        );


    weatherGrid =
        new WeatherGrid({

            latitude:
                Number.isFinite(
                    latitude
                )
                ? latitude
                : 38.5598,

            longitude:
                Number.isFinite(
                    longitude
                )
                ? longitude
                : 68.7870,

            size:
                17,

            step:
                0.15

        });


    const grid =
        weatherGrid.build();


    const temperature =
        Number(
            weatherData
                ?.hourly
                ?.temperature_2m
                ?.at(0)
        );


    const base =
        Number.isFinite(
            temperature
        )
        ? temperature
        : 20;


    const values =
        grid.map(
            point => {


                const distance =
                    Math.sqrt(

                        Math.pow(
                            point.latitude -
                            latitude,
                            2
                        )

                        +

                        Math.pow(
                            point.longitude -
                            longitude,
                            2
                        )

                    );


                return (
                    base -
                    distance * 2.5
                );

            }
        );


    weatherGrid.applyValues(
        values
    );


    gridInfo.textContent =

        "GRID " +

        weatherGrid.getSize() +

        " × " +

        weatherGrid.getSize() +

        " • " +

        grid.length +

        " points";


    return grid;

}


/*
====================================================
 TEMPERATURE COLOR
====================================================
*/


function temperatureColor(
    value
) {


    if (
        value <= -20
    ) return "#172554";


    if (
        value <= -10
    ) return "#1d4ed8";


    if (
        value <= 0
    ) return "#38bdf8";


    if (
        value <= 10
    ) return "#22d3ee";


    if (
        value <= 20
    ) return "#4ade80";


    if (
        value <= 25
    ) return "#facc15";


    if (
        value <= 30
    ) return "#fb923c";


    if (
        value <= 35
    ) return "#f97316";


    if (
        value <= 40
    ) return "#ef4444";


    return "#b91c1c";

}


/*
====================================================
 TEMPERATURE RENDERER
====================================================
*/


function renderTemperatureGrid() {


    if (
        !mapEngine?.map ||
        !weatherGrid
    ) {

        return;

    }


    hideTemperatureGrid();


    temperatureLayer =
        L.layerGroup();


    const grid =
        weatherGrid.getGrid();


    const step =
        weatherGrid.getStep();


    const halfStep =
        step / 2;


    grid.forEach(
        point => {


            const value =
                Number(
                    point.value
                );


            if (
                !Number.isFinite(
                    value
                )
            ) {

                return;

            }


            const bounds = [

                [

                    point.latitude -
                    halfStep,

                    point.longitude -
                    halfStep

                ],

                [

                    point.latitude +
                    halfStep,

                    point.longitude +
                    halfStep

                ]

            ];


            L.rectangle(

                bounds,

                {

                    stroke:
                        false,

                    fill:
                        true,

                    fillColor:
                        temperatureColor(
                            value
                        ),

                    fillOpacity:
                        0.38,

                    interactive:
                        false

                }

            ).addTo(
                temperatureLayer
            );

        }
    );


    temperatureLayer.addTo(
        mapEngine.map
    );


    gridVisible =
        true;

}


/*
====================================================
 HIDE TEMPERATURE
====================================================
*/


function hideTemperatureGrid() {


    if (
        temperatureLayer &&
        mapEngine?.map
    ) {

        mapEngine.map
            .removeLayer(
                temperatureLayer
            );

    }


    temperatureLayer =
        null;


    gridVisible =
        false;

}


/*
====================================================
 CREATE RAIN
====================================================
*/


function createRainLayer() {


    if (
        !rainLayer
    ) {

        rainLayer =
            new RainLayer(

                mapEngine,

                weatherData

            );

    }


    return rainLayer;

}


/*
====================================================
 WEATHER UI
====================================================
*/


function updateWeather() {


    const hourly =
        weatherData?.hourly;


    if (
        !hourly
    ) {

        throw new Error(
            "Hourly data отсутствует"
        );

    }


    const i = 0;


    const temperature =
        Number(
            hourly
                ?.temperature_2m
                ?.at(i)
        );


    if (
        Number.isFinite(
            temperature
        )
    ) {

        $("temperature")
            .textContent =

            Math.round(
                temperature
            ) +

            "°C";

    }


    const humidity =
        Number(
            hourly
                ?.relative_humidity_2m
                ?.at(i)
        );


    if (
        Number.isFinite(
            humidity
        )
    ) {

        $("humidity")
            .textContent =

            Math.round(
                humidity
            ) +

            "%";

    }


    const rain =
        Number(
            hourly
                ?.precipitation
                ?.at(i)
        );


    if (
        Number.isFinite(
            rain
        )
    ) {

        $("rain")
            .textContent =

            rain.toFixed(1) +

            " mm";

    }


    const wind =
        Number(
            hourly
                ?.wind_speed_10m
                ?.at(i)
        );


    if (
        Number.isFinite(
            wind
        )
    ) {

        $("wind")
            .textContent =

            wind.toFixed(1) +

            " km/h";

    }


    const clouds =
        Number(
            hourly
                ?.cloud_cover
                ?.at(i)
        );


    if (
        Number.isFinite(
            clouds
        )
    ) {

        $("clouds")
            .textContent =

            Math.round(
                clouds
            ) +

            "%";

    }


    const pressure =
        Number(
            hourly
                ?.pressure_msl
                ?.at(i)
        );


    if (
        Number.isFinite(
            pressure
        )
    ) {

        $("pressure")
            .textContent =

            Math.round(
                pressure
            ) +

            " hPa";

    }

}


/*
====================================================
 TEMPERATURE BUTTON
====================================================
*/


$("temperatureLayer")
.addEventListener(
    "click",
    () => {


        if (
            rainLayer?.isVisible?.()
        ) {

            rainLayer.hide();

        }


        renderTemperatureGrid();


        setActive(
            "temperatureLayer"
        );


        status.textContent =
            "🌡 Temperature";

    }
);


/*
====================================================
 GRID BUTTON
====================================================
*/


$("gridLayer")
.addEventListener(
    "click",
    () => {


        if (
            gridVisible
        ) {

            hideTemperatureGrid();

        }
        else {

            renderTemperatureGrid();

        }


        setActive(
            "gridLayer"
        );


        status.textContent =

            gridVisible

            ? "🔥 Temperature Grid"

            : "🔥 Grid hidden";

    }
);


/*
====================================================
 RAIN BUTTON
====================================================
*/


$("rainLayer")
.addEventListener(
    "click",
    () => {


        try {


            hideTemperatureGrid();


            const rain =
                createRainLayer();


            rain.show();


            setActive(
                "rainLayer"
            );


            status.textContent =
                "🌧 Rain Layer";


            systemStatus.textContent =
                "SHOHIN V5.4 • RAIN ✓";


        }
        catch (
            error
        ) {


            console.error(
                "RainLayer error:",
                error
            );


            status.textContent =
                "🌧 Rain error";


            showError(
                error
            );

        }

    }
);


/*
====================================================
 WIND
====================================================
*/


$("windLayer")
.addEventListener(
    "click",
    () => {


        setActive(
            "windLayer"
        );


        status.textContent =
            "💨 Wind — V5.5";

    }
);


/*
====================================================
 CLOUDS
====================================================
*/


$("cloudLayer")
.addEventListener(
    "click",
    () => {


        setActive(
            "cloudLayer"
        );


        status.textContent =
            "☁ Clouds — V5.6";

    }
);


/*
====================================================
 PRESSURE
====================================================
*/


$("pressureLayer")
.addEventListener(
    "click",
    () => {


        setActive(
            "pressureLayer"
        );


        status.textContent =
            "🌀 Pressure — V5.7";

    }
);


/*
====================================================
 ACTIVE
====================================================
*/


function setActive(
    id
) {


    document
        .querySelectorAll(
            ".layerButton"
        )
        .forEach(
            button => {

                button
                    .classList
                    .remove(
                        "active"
                    );

            }
        );


    $(id)
        .classList
        .add(
            "active"
        );

}


/*
====================================================
 ERROR
====================================================
*/


function showError(
    error
) {


    const message =

        error?.stack ||

        error?.message ||

        String(
            error
        );


    errorBox.textContent =

        "❌ SHOHIN WEATHER V5.4\n\n" +

        message;


    errorBox.classList.add(
        "show"
    );

}


/*
====================================================
 START
====================================================
*/


async function start() {


    try {


        loadingText.textContent =
            "Загрузка модулей...";


        await loadModules();


        await startWeather();


        await startMap();


        createGrid();


        createRainLayer();


        updateWeather();


        renderTemperatureGrid();


        const latitude =
            Number(
                weatherEngine
                    ?.location
                    ?.latitude
            );


        const longitude =
            Number(
                weatherEngine
                    ?.location
                    ?.longitude
            );


        if (
            Number.isFinite(latitude)
            &&
            Number.isFinite(longitude)
        ) {

            $("coordinates")
                .textContent =

                latitude.toFixed(4) +

                "° N, " +

                longitude.toFixed(4) +

                "° E";

        }


        online.textContent =
            "● SHOHIN ONLINE";


        online.style.color =
            "#4ade80";


        systemStatus.textContent =
            "SHOHIN V5.4 • API ✓ • MAP ✓ • GRID ✓ • RAIN ✓";


        loading.classList.add(
            "hidden"
        );


        console.log(
            "SHOHIN WEATHER V5.4 READY"
        );


    }
    catch (
        error
    ) {


        console.error(
            "SHOHIN V5.4 ERROR:",
            error
        );


        loading.classList.add(
            "hidden"
        );


        online.textContent =
            "● ERROR";


        online.style.color =
            "#fb7185";


        systemStatus.textContent =
            "SHOHIN V5.4 • ERROR";


        showError(
            error
        );

    }

}


start();

</script>

</body>

</html>
