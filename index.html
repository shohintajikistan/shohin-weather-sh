<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#071522">
<title>SHOHIN Weather — Global</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#071522;
    color:white;
}

button,input{
    font:inherit;
}

#app{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#071522;
}

/* MAP */

#map{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

/* TOP */

.top{
    position:absolute;
    top:14px;
    left:14px;
    right:14px;
    z-index:20;
    display:flex;
    align-items:center;
    gap:10px;
    pointer-events:none;
}

.brand{
    pointer-events:auto;
    padding:11px 15px;
    border-radius:17px;
    background:rgba(5,16,29,.78);
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(18px);
    box-shadow:0 10px 35px rgba(0,0,0,.25);
}

.brand strong{
    display:block;
    font-size:16px;
    font-weight:850;
}

.brand span{
    display:block;
    margin-top:2px;
    font-size:9px;
    letter-spacing:1.1px;
    opacity:.55;
}

.close{
    margin-left:auto;
    pointer-events:auto;
    width:44px;
    height:44px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:50%;
    color:white;
    background:rgba(5,16,29,.82);
    backdrop-filter:blur(15px);
    cursor:pointer;
    font-size:18px;
}

/* LEFT PANEL */

.panel{
    position:absolute;
    z-index:15;
    top:78px;
    left:14px;
    width:280px;
    max-height:calc(100vh - 180px);
    overflow:auto;
    padding:12px;
    border-radius:21px;
    background:rgba(5,16,29,.80);
    border:1px solid rgba(255,255,255,.11);
    backdrop-filter:blur(20px);
    box-shadow:0 18px 55px rgba(0,0,0,.30);
}

.panel::-webkit-scrollbar{
    width:3px;
}

.panel::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.2);
    border-radius:20px;
}

.section-title{
    margin:5px 4px 8px;
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:1.2px;
    opacity:.5;
}

.layers{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
}

.layer{
    border:1px solid rgba(255,255,255,.09);
    background:rgba(255,255,255,.055);
    color:white;
    border-radius:13px;
    padding:10px 8px;
    text-align:left;
    cursor:pointer;
    transition:.2s;
    font-size:11px;
}

.layer b{
    display:block;
    font-size:18px;
    margin-bottom:3px;
}

.layer.active{
    background:rgba(255,255,255,.16);
    border-color:rgba(255,255,255,.3);
}

/* INFO */

.info{
    display:none;
    margin-top:10px;
    padding:12px;
    border-radius:16px;
    background:rgba(255,255,255,.055);
}

.location{
    font-size:15px;
    font-weight:800;
}

.coordinates{
    margin-top:3px;
    font-size:9px;
    opacity:.45;
}

.temperature{
    margin:11px 0;
    font-size:38px;
    font-weight:850;
    line-height:1;
}

.metrics{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
}

.metric{
    padding:8px;
    border-radius:10px;
    background:rgba(255,255,255,.055);
    font-size:9px;
    opacity:.8;
}

.metric b{
    display:block;
    margin-top:3px;
    font-size:11px;
    opacity:1;
}

/* CHART */

#chart{
    width:100%;
    height:105px;
    display:block;
    margin-top:10px;
}

/* BOTTOM */

.bottom{
    position:absolute;
    left:14px;
    right:14px;
    bottom:14px;
    z-index:20;
    padding:11px;
    border-radius:19px;
    background:rgba(5,16,29,.83);
    border:1px solid rgba(255,255,255,.11);
    backdrop-filter:blur(20px);
    box-shadow:0 15px 50px rgba(0,0,0,.3);
}

.time-row{
    display:flex;
    align-items:center;
    gap:9px;
}

.play{
    flex:0 0 auto;
    width:42px;
    height:42px;
    border:0;
    border-radius:50%;
    background:white;
    color:#071522;
    cursor:pointer;
    font-weight:800;
}

#time{
    flex:1;
    accent-color:white;
}

.time-label{
    width:100px;
    text-align:right;
    font-size:9px;
    opacity:.7;
}

.legend{
    display:flex;
    align-items:center;
    gap:7px;
    margin-top:8px;
    font-size:8px;
    opacity:.55;
}

.gradient{
    flex:1;
    height:6px;
    border-radius:10px;
    background:linear-gradient(
        90deg,
        #2454a6,
        #4ca7dc,
        #9bd6a0,
        #ffff91,
        #f6a44d,
        #df3333
    );
}

/* OPEN BUTTON */

.open{
    position:absolute;
    z-index:30;
    right:15px;
    bottom:85px;
    padding:12px 15px;
    border:1px solid rgba(255,255,255,.13);
    border-radius:15px;
    background:rgba(5,16,29,.85);
    color:white;
    backdrop-filter:blur(15px);
    cursor:pointer;
    font-weight:750;
    box-shadow:0 10px 35px rgba(0,0,0,.3);
}

/* LOADING */

.loading{
    position:absolute;
    inset:0;
    z-index:50;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.12);
    pointer-events:none;
}

.loading.show{
    display:flex;
}

.spinner{
    width:38px;
    height:38px;
    border:3px solid rgba(255,255,255,.18);
    border-top-color:white;
    border-radius:50%;
    animation:spin .7s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

/* RESPONSIVE */

@media(max-width:600px){

    .panel{
        width:238px;
        top:70px;
    }

    .temperature{
        font-size:31px;
    }

    .bottom{
        left:8px;
        right:8px;
        bottom:8px;
    }

    .time-label{
        width:80px;
        font-size:8px;
    }

    .open{
        right:10px;
        bottom:82px;
    }
}
</style>
</head>

<body>

<div id="app">

    <canvas id="map"></canvas>

    <!-- HEADER -->
    <div class="top">

        <div class="brand">
            <strong>🌍 SHOHIN Weather</strong>
            <span>GLOBAL METEOROLOGICAL SYSTEM</span>
        </div>

        <button class="close" id="close">✕</button>

    </div>

    <!-- PANEL -->
    <div class="panel">

        <div class="section-title">
            Weather Layers
        </div>

        <div class="layers">

            <button class="layer active" data-layer="temperature">
                <b>🌡️</b>
                Temperature
            </button>

            <button class="layer" data-layer="rain">
                <b>🌧️</b>
                Precipitation
            </button>

            <button class="layer" data-layer="wind">
                <b>💨</b>
                Wind
            </button>

            <button class="layer" data-layer="cloud">
                <b>☁️</b>
                Clouds
            </button>

            <button class="layer" data-layer="pressure">
                <b>🌀</b>
                Pressure
            </button>

            <button class="layer" data-layer="humidity">
                <b>💧</b>
                Humidity
            </button>

        </div>

        <div class="info" id="info">

            <div class="location" id="location">
                Dushanbe
            </div>

            <div class="coordinates" id="coordinates">
                38.5598, 68.7870
            </div>

            <div class="temperature" id="temperature">
                --°
            </div>

            <div class="metrics">

                <div class="metric">
                    💧 Humidity
                    <b id="humidity">--%</b>
                </div>

                <div class="metric">
                    💨 Wind
                    <b id="wind">-- km/h</b>
                </div>

                <div class="metric">
                    🌧️ Rain
                    <b id="rain">-- mm</b>
                </div>

                <div class="metric">
                    🌀 Pressure
                    <b id="pressure">-- hPa</b>
                </div>

                <div class="metric">
                    ☁️ Clouds
                    <b id="cloud">--%</b>
                </div>

                <div class="metric">
                    🧭 Direction
                    <b id="direction">--°</b>
                </div>

            </div>

            <canvas id="chart"></canvas>

        </div>

    </div>

    <!-- TIME -->
    <div class="bottom">

        <div class="time-row">

            <button class="play" id="play">
                ▶
            </button>

            <input
                id="time"
                type="range"
                min="0"
                max="23"
                step="1"
                value="0"
            >

            <div class="time-label" id="timeLabel">
                Loading...
            </div>

        </div>

        <div class="legend">
            <span>Cold</span>
            <div class="gradient"></div>
            <span>Hot</span>
        </div>

    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
    </div>

    <button class="open" id="open">
        🌍 Global Weather
    </button>

</div>

<script>
"use strict";

/* =========================================================
   SHOHIN WEATHER GLOBAL ENGINE
   ========================================================= */

const canvas =
    document.getElementById("map");

const ctx =
    canvas.getContext("2d");

const chart =
    document.getElementById("chart");

const chartCtx =
    chart.getContext("2d");

const UI = {

    open:document.getElementById("open"),
    close:document.getElementById("close"),

    loading:document.getElementById("loading"),

    info:document.getElementById("info"),

    location:document.getElementById("location"),
    coordinates:document.getElementById("coordinates"),

    temperature:document.getElementById("temperature"),
    humidity:document.getElementById("humidity"),
    wind:document.getElementById("wind"),
    rain:document.getElementById("rain"),
    pressure:document.getElementById("pressure"),
    cloud:document.getElementById("cloud"),
    direction:document.getElementById("direction"),

    time:document.getElementById("time"),
    timeLabel:document.getElementById("timeLabel"),

    play:document.getElementById("play")
};

let W = 0;
let H = 0;

let layer = "temperature";

let lat = 38.5598;
let lon = 68.7870;

let hour = 0;

let data = null;

let playing = false;
let timer = null;

const cache = new Map();

/* =========================================================
   CANVAS
   ========================================================= */

function resize(){

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * dpr;
    canvas.height = H * dpr;

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    draw();

}

window.addEventListener(
    "resize",
    resize
);

/* =========================================================
   PROJECTION
   ========================================================= */

function project(latitude,longitude){

    return {

        x:
            ((longitude + 180) / 360) * W,

        y:
            ((90 - latitude) / 180) * H

    };

}

/* =========================================================
   COLORS
   ========================================================= */

function tempColor(t){

    const stops = [

        [-30,[38,88,170]],
        [-10,[64,151,220]],
        [0,[95,190,175]],
        [15,[244,237,105]],
        [25,[247,155,63]],
        [35,[221,57,48]],
        [45,[135,28,43]]

    ];

    if(t <= stops[0][0])
        return rgb(stops[0][1]);

    if(t >= stops.at(-1)[0])
        return rgb(stops.at(-1)[1]);

    for(let i=0;i<stops.length-1;i++){

        const a = stops[i];
        const b = stops[i+1];

        if(t>=a[0] && t<=b[0]){

            const k =
                (t-a[0]) /
                (b[0]-a[0]);

            return rgb([

                Math.round(
                    a[1][0]+
                    (b[1][0]-a[1][0])*k
                ),

                Math.round(
                    a[1][1]+
                    (b[1][1]-a[1][1])*k
                ),

                Math.round(
                    a[1][2]+
                    (b[1][2]-a[1][2])*k
                )

            ]);

        }

    }

    return "#777";

}

function rgb(c){

    return `rgb(${c[0]},${c[1]},${c[2]})`;

}

/* =========================================================
   DRAW
   ========================================================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    /* background */

    const bg =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    bg.addColorStop(
        0,
        "#061525"
    );

    bg.addColorStop(
        .5,
        "#0b2637"
    );

    bg.addColorStop(
        1,
        "#06131f"
    );

    ctx.fillStyle = bg;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    drawGrid();

    drawField();

    drawSelection();

}

/* =========================================================
   GRID
   ========================================================= */

function drawGrid(){

    ctx.save();

    ctx.strokeStyle =
        "rgba(255,255,255,.055)";

    ctx.lineWidth = 1;

    for(
        let longitude=-180;
        longitude<=180;
        longitude+=30
    ){

        const a =
            project(-90,longitude);

        const b =
            project(90,longitude);

        ctx.beginPath();

        ctx.moveTo(
            a.x,
            a.y
        );

        ctx.lineTo(
            b.x,
            b.y
        );

        ctx.stroke();

    }

    for(
        let latitude=-60;
        latitude<=60;
        latitude+=30
    ){

        const a =
            project(latitude,-180);

        const b =
            project(latitude,180);

        ctx.beginPath();

        ctx.moveTo(
            a.x,
            a.y
        );

        ctx.lineTo(
            b.x,
            b.y
        );

        ctx.stroke();

    }

    ctx.restore();

}

/* =========================================================
   WEATHER FIELD
   ========================================================= */

function drawField(){

    const step =
        W < 600 ? 42 : 62;

    for(
        let y=0;
        y<H;
        y+=step
    ){

        for(
            let x=0;
            x<W;
            x+=step
        ){

            const latitude =
                90 -
                (y/H)*180;

            const longitude =
                (x/W)*360-180;

            let color;

            if(layer==="temperature"){

                let t =
                    31 -
                    Math.abs(latitude)*.43;

                t +=
                    Math.sin(
                        (longitude +
                        hour*8) *
                        Math.PI/90
                    )*3;

                t +=
                    Math.cos(
                        latitude*
                        Math.PI/45
                    )*2;

                color =
                    tempColor(t);

            }

            else if(layer==="rain"){

                const r =
                    5 +
                    Math.sin(
                        (
                            latitude+
                            longitude+
                            hour*5
                        ) *
                        Math.PI/45
                    )*8;

                color =
                    `rgba(
                        35,
                        145,
                        255,
                        ${Math.min(
                            .55,
                            Math.max(0,r/28)
                        )}
                    )`;

            }

            else if(layer==="cloud"){

                const c =
                    45 +
                    Math.sin(
                        (
                            latitude*2+
                            longitude+
                            hour*4
                        ) *
                        Math.PI/80
                    )*35;

                color =
                    `rgba(
                        225,
                        235,
                        245,
                        ${Math.max(
                            .04,
                            c/260
                        )}
                    )`;

            }

            else if(layer==="humidity"){

                const h =
                    50 +
                    Math.cos(
                        latitude*
                        Math.PI/90
                    )*40;

                color =
                    `rgba(
                        45,
                        190,
                        220,
                        ${h/270}
                    )`;

            }

            else if(layer==="pressure"){

                const p =
                    1013+
                    Math.sin(
                        (
                            latitude+
                            longitude+
                            hour
                        ) *
                        Math.PI/70
                    )*15;

                const a =
                    .12+
                    Math.abs(
                        p-1013
                    )/100;

                color =
                    `rgba(
                        180,
                        90,
                        255,
                        ${Math.min(.48,a)}
                    )`;

            }

            else{

                const a =
                    .15+
                    Math.abs(
                        Math.sin(
                            (
                                latitude+
                                longitude+
                                hour*5
                            ) *
                            Math.PI/60
                        )
                    )*.35;

                color =
                    `rgba(
                        55,
                        220,
                        180,
                        ${a}
                    )`;

            }

            ctx.fillStyle =
                color;

            ctx.fillRect(
                x,
                y,
                step+1,
                step+1
            );

        }

    }

    ctx.fillStyle =
        "rgba(3,12,22,.38)";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    /* WIND ANIMATION */

    if(layer==="wind"){

        ctx.save();

        ctx.strokeStyle =
            "rgba(255,255,255,.55)";

        ctx.lineWidth = 1.3;

        for(
            let i=0;
            i<100;
            i++
        ){

            const x =
                (
                    i*139+
                    hour*25
                )%W;

            const y =
                (
                    i*73
                )%H;

            ctx.beginPath();

            ctx.moveTo(
                x,
                y
            );

            ctx.lineTo(
                x+14,
                y-4
            );

            ctx.stroke();

        }

        ctx.restore();

    }

}

/* =========================================================
   SELECTED LOCATION
   ========================================================= */

function drawSelection(){

    const p =
        project(
            lat,
            lon
        );

    ctx.save();

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y,
        12,
        0,
        Math.PI*2
    );

    ctx.strokeStyle =
        "rgba(255,255,255,.9)";

    ctx.lineWidth = 2;

    ctx.stroke();

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y,
        4,
        0,
        Math.PI*2
    );

    ctx.fillStyle =
        "#fff";

    ctx.fill();

    ctx.restore();

}

/* =========================================================
   OPEN WEATHER API
   ========================================================= */

async function getWeather(){

    const key =
        `${lat.toFixed(3)},${lon.toFixed(3)}`;

    if(cache.has(key)){

        data =
            cache.get(key);

        update();

        return;

    }

    UI.loading.classList.add(
        "show"
    );

    try{

        const url =
            "https://api.open-meteo.com/v1/forecast"+
            `?latitude=${lat}`+
            `&longitude=${lon}`+
            "&hourly="+
            [
                "temperature_2m",
                "relative_humidity_2m",
                "precipitation",
                "cloud_cover",
                "pressure_msl",
                "wind_speed_10m",
                "wind_direction_10m"
            ].join(",")+
            "&forecast_days=2"+
            "&timezone=auto";

        const response =
            await fetch(url);

        if(!response.ok)
            throw new Error(
                "Weather request failed"
            );

        data =
            await response.json();

        cache.set(
            key,
            data
        );

        update();

    }
    catch(error){

        console.error(
            "SHOHIN WEATHER:",
            error
        );

        UI.location.textContent =
            "Weather data unavailable";

    }
    finally{

        UI.loading.classList.remove(
            "show"
        );

    }

}

/* =========================================================
   UPDATE INFORMATION
   ========================================================= */

function update(){

    if(!data?.hourly)
        return;

    UI.info.style.display =
        "block";

    const h =
        data.hourly;

    const i =
        Math.min(
            hour,
            h.time.length-1
        );

    const t =
        h.temperature_2m?.[i];

    const hum =
        h.relative_humidity_2m?.[i];

    const wind =
        h.wind_speed_10m?.[i];

    const rain =
        h.precipitation?.[i];

    const pressure =
        h.pressure_msl?.[i];

    const cloud =
        h.cloud_cover?.[i];

    const direction =
        h.wind_direction_10m?.[i];

    UI.temperature.textContent =
        Number.isFinite(t)
        ? `${Math.round(t)}°`
        : "--°";

    UI.humidity.textContent =
        Number.isFinite(hum)
        ? `${Math.round(hum)}%`
        : "--%";

    UI.wind.textContent =
        Number.isFinite(wind)
        ? `${Math.round(wind)} km/h`
        : "-- km/h";

    UI.rain.textContent =
        Number.isFinite(rain)
        ? `${rain.toFixed(1)} mm`
        : "-- mm";

    UI.pressure.textContent =
        Number.isFinite(pressure)
        ? `${Math.round(pressure)} hPa`
        : "-- hPa";

    UI.cloud.textContent =
        Number.isFinite(cloud)
        ? `${Math.round(cloud)}%`
        : "--%";

    UI.direction.textContent =
        Number.isFinite(direction)
        ? `${Math.round(direction)}°`
        : "--°";

    UI.coordinates.textContent =
        `${lat.toFixed(4)}, ${lon.toFixed(4)}`;

    if(h.time?.[i]){

        const date =
            new Date(h.time[i]);

        UI.timeLabel.textContent =
            date.toLocaleString(
                undefined,
                {
                    weekday:"short",
                    hour:"2-digit",
                    minute:"2-digit"
                }
            );

    }

    drawChart();

}

/* =========================================================
   CHART
   ========================================================= */

function drawChart(){

    if(!data?.hourly)
        return;

    const values =
        data.hourly.temperature_2m
        ?.slice(0,24)
        ?.filter(
            Number.isFinite
        );

    if(!values?.length)
        return;

    const w =
        chart.clientWidth;

    const h =
        chart.clientHeight;

    const dpr =
        Math.min(
            window.devicePixelRatio||1,
            2
        );

    chart.width =
        w*dpr;

    chart.height =
        h*dpr;

    chartCtx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    chartCtx.clearRect(
        0,
        0,
        w,
        h
    );

    const min =
        Math.min(...values)-2;

    const max =
        Math.max(...values)+2;

    /* GRID */

    chartCtx.strokeStyle =
        "rgba(255,255,255,.08)";

    chartCtx.lineWidth=1;

    for(let i=1;i<4;i++){

        const y =
            (h/4)*i;

        chartCtx.beginPath();

        chartCtx.moveTo(
            0,
            y
        );

        chartCtx.lineTo(
            w,
            y
        );

        chartCtx.stroke();

    }

    /* LINE */

    chartCtx.beginPath();

    values.forEach(
        (value,i)=>{

            const x =
                4+
                i/
                Math.max(
                    1,
                    values.length-1
                )*
                (w-8);

            const y =
                h-
                (
                    (value-min)/
                    (max-min)
                )*
                (h-12)-
                6;

            if(i===0)
                chartCtx.moveTo(
                    x,
                    y
                );
            else
                chartCtx.lineTo(
                    x,
                    y
                );

        }
    );

    chartCtx.strokeStyle =
        "#ffffff";

    chartCtx.lineWidth=2;

    chartCtx.stroke();

}

/* =========================================================
   MAP CLICK
   ========================================================= */

canvas.addEventListener(
    "click",
    async event=>{

        const rect =
            canvas.getBoundingClientRect();

        const x =
            event.clientX-
            rect.left;

        const y =
            event.clientY-
            rect.top;

        lon =
            (x/W)*360-180;

        lat =
            90-
            (y/H)*180;

        hour=0;

        UI.time.value=0;

        UI.location.textContent =
            "Selected location";

        draw();

        await getWeather();

    }
);

/* =========================================================
   LAYERS
   ========================================================= */

document
.querySelectorAll(".layer")
.forEach(
    button=>{

        button.addEventListener(
            "click",
            ()=>{

                document
                .querySelectorAll(".layer")
                .forEach(
                    b=>
                    b.classList.remove(
                        "active"
                    )
                );

                button.classList.add(
                    "active"
                );

                layer =
                    button.dataset.layer;

                draw();

            }
        );

    }
);

/* =========================================================
   TIME SLIDER
   ========================================================= */

UI.time.addEventListener(
    "input",
    ()=>{

        hour =
            Number(
                UI.time.value
            );

        draw();

        update();

    }
);

/* =========================================================
   PLAY
   ========================================================= */

UI.play.addEventListener(
    "click",
    ()=>{

        if(playing){

            clearInterval(timer);

            timer=null;

            playing=false;

            UI.play.textContent="▶";

            return;

        }

        playing=true;

        UI.play.textContent="❚❚";

        timer =
            setInterval(
                ()=>{

                    hour++;

                    if(hour>23)
                        hour=0;

                    UI.time.value =
                        hour;

                    draw();

                    update();

                },
                650
            );

    }
);

/* =========================================================
   BUTTONS
   ========================================================= */

UI.open.addEventListener(
    "click",
    ()=>{

        UI.open.style.display =
            "none";

        document.body.style.overflow =
            "hidden";

        resize();

        getWeather();

    }
);

UI.close.addEventListener(
    "click",
    ()=>{

        UI.open.style.display =
            "block";

        if(playing){

            clearInterval(timer);

            timer=null;

            playing=false;

            UI.play.textContent="▶";

        }

    }
);

/* =========================================================
   START
   ========================================================= */

resize();

getWeather();

</script>
